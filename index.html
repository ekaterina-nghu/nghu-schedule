<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#20242a;--muted:#6b7280;--line:#dfe3e8;--accent:#2f6fed;--bad:#c62828;--warn:#a15c00;--good:#18794e}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);overflow:auto}
nav button,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
nav button.active{background:#edf3ff;border-color:#b9cdfb;color:#1d4ed8}
main{padding:18px;max-width:1500px;margin:auto}.tab{display:none}.tab.active{display:block}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.metric{font-size:28px;font-weight:700}.label{color:var(--muted);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{background:#f7f8fa;position:sticky;top:0;z-index:1}
.small{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;background:#eef0f3;margin:1px}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.schedule{display:grid;grid-template-columns:150px repeat(6,minmax(130px,1fr));background:#fff;border:1px solid var(--line)}
.schedule>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:76px;padding:6px}
.head{background:#f7f8fa;font-weight:600;min-height:auto}.time{background:#fafafa;font-size:11px;color:var(--muted)}
.cell{cursor:pointer}.cell:hover{background:#f3f7ff}.lesson{background:#edf3ff;border-left:3px solid var(--accent);border-radius:6px;padding:5px;font-size:11px;margin:1px 0}.lesson.conflict{border-left-color:var(--bad);background:#fff0f0}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:12px;padding:18px;width:min(560px,94vw);max-height:90vh;overflow:auto}
.kpi{display:flex;gap:8px;flex-wrap:wrap}.kpi span{padding:5px 8px;border-radius:7px;background:#f0f2f5}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.schedule{grid-template-columns:95px repeat(6,140px);overflow:auto}.schedule{min-width:935px}}
</style>
<style>
.btn.active{font-weight:700;box-shadow:inset 0 -2px 0 currentColor}
.v09item{padding:8px 0;border-bottom:1px solid #ddd}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

 return roundHours(r?.[`Часов/нед ${settings.semester}`]);
}
function streamWeeks(st){

}
function conflict(a,b){
 if(a.day!==b.day || a.slot!==b.slot) return false;
 const ag=new Set(a.groups||[]), bg=new Set(b.groups||[]);

}

       if(si+need>slots.length || si+need>4 && si<4) ok=false;
       for(let k=0;k<need&&ok;k++){
         if(si+k===4) ok=false;

       }
       if(ok){
         for(let k=0;k<need;k++) lessons.push({id:crypto.randomUUID(),day:d,slot:si+k,groups:s.groups,subject:s.subject,teacher:s.teacher,room:"",streamKey:[s.teacher,s.subject,s.groups.join("|")].join("¦")});
         placed+=need;
       }
       guard++; if(guard>20000) break;
     }
   }
 }
 save(); renderSchedule();
 alert("Генерация завершена. Это эвристический черновик: занятия без преподавателя не ставятся, конфликты групп/преподавателей блокируются. Аудитории и точная недельная раскладка требуют последующей настройки.");
}

<script>
/* ===== НГХУ v2.6 upgrade =====
   Adds week-aware editing, room directory, "what fits here?",
   workload tracking and stronger conflict diagnostics.
   Source tariff values remain untouched.
*/
const V04_WEEKS = {
  I: Array.from({length:16},(_,i)=>i+1),
  II: Array.from({length:20},(_,i)=>i+1)
};
const V04_ROOMS = [
 "101","103","105","106","107","108","109","111","112",
 "116","203","204","205-206","207","208","209","211а","211б",
 "Спартака, 12 №212","Спартака, 12 №216","Спартака, 12 №217",
 "Динамо","УМО","12"
];

settings.currentWeek = settings.currentWeek || 1;
settings.currentGroup = settings.currentGroup || "Ж-31";
settings.roomList = settings.roomList || V04_ROOMS.slice();
save();

function v04WeekList(){ return V04_WEEKS[settings.semester] || V04_WEEKS.I; }
function v04WeekOf(l){ return l.week == null ? 1 : Number(l.week); }

function v04Conflict(a,b){
  if(v04WeekOf(a)!==v04WeekOf(b) || a.day!==b.day || a.slot!==b.slot) return false;
  const ag=new Set(a.groups||[]), bg=new Set(b.groups||[]);
  const groupConflict=[...ag].some(x=>bg.has(x));
  const teacherConflict=a.teacher && b.teacher && a.teacher===b.teacher;
  const roomConflict=a.room && b.room && a.room===b.room;
  return groupConflict || teacherConflict || roomConflict;
}
function v04Conflicts(l, ignoreId=null){
  return lessons.filter(x=>x.id!==ignoreId && v04Conflict(l,x));
}
function v04NormalizeLessons(){
  lessons.forEach(l=>{
    if(l.week==null) l.week=1;
    if(!Array.isArray(l.groups)) l.groups=[];
  });
}
v04NormalizeLessons(); save();

function v04StreamForLesson(l){
  return DATA.streams.find(s=>[s.teacher||"",s.subject||"",s.groups.join("|")].join("¦")===l.streamKey)
      || DATA.streams.find(s=>s.subject===l.subject && s.teacher===l.teacher && JSON.stringify(s.groups)===JSON.stringify(l.groups));
}
function v04Required(st){
  const r=st.rows.find(x=>x[`Часов за семестр ${settings.semester}`]!=null) || st.rows[0];
  return {
    weeks:r?.[`Недели ${settings.semester}`] ?? null,
    weekly:r?.[`Часов/нед ${settings.semester}`] ?? null,
    semester:r?.[`Часов за семестр ${settings.semester}`] ?? null,
    planning:roundHours(r?.[`Часов/нед ${settings.semester}`])
  };
}
function v04PlacedForStream(st){
  const key=[st.teacher,st.subject,st.groups.join("|")].join("¦");
  return lessons.filter(l=>l.streamKey===key);
}
function v04SlotCount(st){
  return v04PlacedForStream(st).filter(l=>v04WeekOf(l)===Number(settings.currentWeek)).length;
}
function v04Status(st){
  const req=v04Required(st), placed=v04SlotCount(st);
  if(req.planning==null) return ["—","warn"];
  if(placed>=req.planning) return ["выполнено","good"];
  return [`осталось ${req.planning-placed}`,"warn"];
}

function v04AvailableReasons(day,slot,group,room){
  const reasons=[];
  const candidate={week:Number(settings.currentWeek),day,slot,groups:[group],teacher:"",room:room||""};
  const groupBusy=lessons.some(l=>v04WeekOf(l)===candidate.week&&l.day===day&&l.slot===slot&&(l.groups||[]).includes(group));
  if(groupBusy) reasons.push("группа уже занята");
  if(room){
    const rb=lessons.some(l=>v04WeekOf(l)===candidate.week&&l.day===day&&l.slot===slot&&l.room===room);
    if(rb) reasons.push("аудитория занята");
  }
  return reasons;
}

function v04RenderSchedule(){
  const group=settings.currentGroup;
  const week=Number(settings.currentWeek);
  const groupLessons=lessons.filter(l=>v04WeekOf(l)===week && l.groups.includes(group));
  document.getElementById("schedule").innerHTML=`
  <div class="toolbar">
    <label>Группа <select id="v04group" onchange="settings.currentGroup=this.value;save();v04RenderSchedule()">
      ${DATA.groups.map(g=>`<option ${g===group?"selected":""}>${esc(g)}</option>`).join("")}
    </select></label>
    <label>Неделя <select id="v04week" onchange="settings.currentWeek=Number(this.value);save();v04RenderSchedule()">
      ${v04WeekList().map(w=>`<option value="${w}" ${w===week?"selected":""}>${w}</option>`).join("")}
    </select></label>
    <button class="btn" onclick="v04GenerateWeek()">Сгенерировать неделю</button>
    <button class="btn" onclick="v04WhatFits()">Что можно поставить сюда?</button>
    <button class="btn" onclick="clearSchedule()">Очистить</button>
  </div>
  <div class="card" style="margin-bottom:12px">
    <b>Неделя ${week} · ${settings.semester} семестр</b>
    <span class="small"> Текущая неделя используется для ручного редактирования. Даты недель намеренно не придуманы: в исходном тарифе их нет.</span>
  </div>
  <div class="schedule">
    <div class="head">Время</div>${days.map(d=>`<div class="head">${d}</div>`).join("")}
    ${slots.map((t,si)=>`<div class="time">${t}</div>${days.map((d,di)=>{
      const ls=groupLessons.filter(l=>l.day===di&&l.slot===si);
      return `<div class="cell" onclick="v04AddLesson(${di},${si},'${esc(group)}')">
        ${ls.map(l=>{
          const c=v04Conflicts(l,l.id);
          return `<div class="lesson ${c.length?'conflict':''}" onclick="event.stopPropagation();v04EditLesson('${l.id}')">
            <b>${esc(l.subject)}</b><br>${esc(l.teacher||"без преподавателя")}<br>${esc(l.room||"ауд. не задана")}
            ${c.length?`<br><span class="bad">КОНФЛИКТ: ${c.length}</span>`:""}
          </div>`;
        }).join("")}
      </div>`;
    }).join("")}`).join("")}
  </div>`;
}
v04RenderSchedule = v04RenderSchedule;

function v04AddLesson(day,slot,group){
  const choices=DATA.streams.filter(s=>s.groups.includes(group));
  document.getElementById("modalbox").innerHTML=`
  <h3>Добавить занятие · ${esc(group)}</h3>

  <br><label>Учебный поток<br><select id="v04stream">
    ${choices.map((s,i)=>`<option value="${i}">${esc(s.subject)} — ${esc(s.teacher||"без преподавателя")} — ${s.groups.join(", ")}</option>`).join("")}
  </select></label>
  <br><label>Аудитория<br><input id="v04room" list="v04rooms" placeholder="например, 211а"></label>
  <datalist id="v04rooms">${settings.roomList.map(r=>`<option value="${esc(r)}">`).join("")}</datalist>
  <div class="toolbar" style="margin-top:14px">
    <button class="btn" onclick="v04CreateLesson(${day},${slot},'${esc(group)}')">Добавить</button>

    <button class="btn" onclick="closeModal()">Отмена</button>
  </div>`;
  document.getElementById("modal").classList.add("show");
}
function v04CreateLesson(day,slot,group){
  const choices=DATA.streams.filter(s=>s.groups.includes(group));
  const s=choices[Number(document.getElementById("v04stream").value)];
  const room=document.getElementById("v04room").value.trim();

           subject:s.subject,teacher:s.teacher,room,
           streamKey:[s.teacher,s.subject,s.groups.join("|")].join("¦")};

  lessons.push(l); save(); closeModal(); v04RenderSchedule();
  if(c.length) alert("Конфликт: "+c.map(x=>x.subject).join(", "));

function v04EditLesson(id){
  const l=lessons.find(x=>x.id===id); if(!l)return;
  document.getElementById("modalbox").innerHTML=`
  <h3>Редактирование занятия</h3>
  <b>${esc(l.subject)}</b><br>${esc(l.groups.join(", "))}<br>${esc(l.teacher||"без преподавателя")}
  <br><br><label>Неделя<br><select id="v04ew">${v04WeekList().map(w=>`<option value="${w}" ${w===v04WeekOf(l)?"selected":""}>${w}</option>`).join("")}</select></label>
  <br><label>День<br><select id="v04ed">${days.map((d,i)=>`<option value="${i}" ${i===l.day?"selected":""}>${d}</option>`).join("")}</select></label>
  <br><label>Время<br><select id="v04es">${slots.map((t,i)=>`<option value="${i}" ${i===l.slot?"selected":""}>${t}</option>`).join("")}</select></label>
  <br><label>Аудитория<br><input id="v04er" list="v04rooms" value="${esc(l.room||"")}"></label>
  <datalist id="v04rooms">${settings.roomList.map(r=>`<option value="${esc(r)}">`).join("")}</datalist>
  <div class="toolbar" style="margin-top:14px">
    <button class="btn" onclick="v04UpdateLesson('${id}')">Сохранить</button>
    <button class="btn" onclick="deleteLesson('${id}')">Удалить</button>
    <button class="btn" onclick="closeModal()">Отмена</button>
  </div>`;
  document.getElementById("modal").classList.add("show");
}
function v04UpdateLesson(id){
  const l=lessons.find(x=>x.id===id);
  l.week=Number(document.getElementById("v04ew").value);
  l.day=Number(document.getElementById("v04ed").value);

}

function v04WhatFits(day=null,slot=null,group=null){
  if(day===null || slot===null){
    day=0; slot=0; group=settings.currentGroup;
    document.getElementById("modalbox").innerHTML=`
      <h3>Что можно поставить?</h3>

  }

    ${free.length?free.join(""):`<tr><td colspan="5">Подходящих потоков нет.</td></tr>`}
    </tbody></table></div>
    <div class="toolbar" style="margin-top:14px"><button class="btn" onclick="closeModal()">Закрыть</button></div>`;
  document.getElementById("modal").classList.add("show");
}

function v04GenerateWeek(){
  const week=Number(settings.currentWeek);
  // Remove only the selected week's generated/manual lessons, then regenerate a conservative draft.
  lessons=lessons.filter(l=>v04WeekOf(l)!==week);
  const streams=[...DATA.streams].filter(s=>s.teacher).sort((a,b)=>(streamHours(b)||0)-(streamHours(a)||0));
  for(const s of streams){
    const n=streamHours(s)||0;
    if(!n) continue;
    const block=s.category==="Практическая"?Math.max(1,Number(settings.defaultBlockPractical)):Number(settings.defaultBlockTheory);
    let placed=0;
    for(let d=0;d<days.length && placed<n;d++){
      for(let si=0;si<slots.length && placed<n;si++){
        if(si===4) continue;
        const need=Math.min(block,n-placed);
        if(si+need>slots.length || (si<4 && si+need>4)) continue;
        let ok=true;
        for(let k=0;k<need;k++){
          if(si+k===4){ok=false;break;}
          const cand={week,day:d,slot:si+k,groups:s.groups,teacher:s.teacher,room:"",subject:s.subject};
          if(v04Conflicts(cand)){ok=false;break;}
        }
        if(ok){
          for(let k=0;k<need;k++) lessons.push({
            id:crypto.randomUUID(),week,day:d,slot:si+k,groups:s.groups,subject:s.subject,
            teacher:s.teacher,room:"",streamKey:[s.teacher,s.subject,s.groups.join("|")].join("¦")
          });
          placed+=need;
        }
      }
    }
  }
  save(); v04RenderSchedule();
  alert("Черновик недели "+week+" создан. Это эвристическая генерация, не финальная оптимизация.");
}

  ${rows.map(r=>{const s=settings.semester,st=DATA.streams.find(x=>x.subject===r["Дисциплина"]&&x.teacher===r["Преподаватель"]&&x.groups.includes(String(r["Группа"]).split(",")[0].trim()));

  <td>${r[`Недели ${s}`]??"—"}</td><td>${req??"—"}</td><td>${roundHours(req)??"—"}</td><td>${r[`Часов за семестр ${s}`]??"—"}</td><td class="small">${esc(r["Источник"])}</td></tr>`}).join("")}
  </tbody></table></div>`;
}

function v04RenderChecks(){
  const noTeacher=DATA.rows.filter(r=>!r["Преподаватель"]);
  const disc=DATA.rows.filter(r=>{const s=settings.semester,w=r[`Недели ${s}`],h=r[`Часов/нед ${s}`],sem=r[`Часов за семестр ${s}`];return w!=null&&h!=null&&sem!=null&&Math.abs(Number(w)*Number(h)-Number(sem))>0.51});
  const conflicts=lessons.flatMap(l=>v04Conflicts(l,l.id).map(x=>[l,x])).filter((p,i,a)=>i<a.length);
  document.getElementById("checks").innerHTML=`
  <div class="grid">
   <div class="card"><div class="metric bad">${noTeacher.length}</div><div class="label">без преподавателя</div></div>
   <div class="card"><div class="metric warn">${disc.length}</div><div class="label">арифметических расхождений</div></div>
   <div class="card"><div class="metric ${conflicts.length?'bad':'good'}">${conflicts.length}</div><div class="label">конфликтов расписания</div></div>
   <div class="card"><div class="metric">${lessons.length}</div><div class="label">занятий в расписании</div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Конфликты текущего расписания</h3>
  ${conflicts.length?conflicts.map(p=>`<div class="bad">${esc(p[0].subject)} ↔ ${esc(p[1].subject)} · ${esc(days[p[0].day])} · неделя ${v04WeekOf(p[0])}</div>`).join(""):"<span class='good'>Конфликтов не обнаружено.</span>"}</div>`;
}

function v04RenderSettings(){
  document.getElementById("settings").innerHTML=`
  <div class="card"><h3>Настройки расписания v2.6</h3>
  <label>Семестр <select onchange="settings.semester=this.value;settings.currentWeek=1;save();v04RenderAll()"><option ${settings.semester==="I"?"selected":""}>I</option><option ${settings.semester==="II"?"selected":""}>II</option></select></label>
  <br><br><label>Блок практической дисциплины <input type="number" min="1" max="6" value="${settings.defaultBlockPractical}" onchange="settings.defaultBlockPractical=Number(this.value);save()"></label>
  <br><br><label>Блок теоретической дисциплины <input type="number" min="1" max="3" value="${settings.defaultBlockTheory}" onchange="settings.defaultBlockTheory=Number(this.value);save()"></label>
  <hr>
  <h3>Аудитории</h3>

  <textarea id="v04rooms" style="width:100%;min-height:120px;margin-top:8px">${esc(settings.roomList.join("\\n"))}</textarea>
  <button class="btn" style="margin-top:8px" onclick="settings.roomList=document.getElementById('v04rooms').value.split(/\\n|,/).map(x=>x.trim()).filter(Boolean);save();alert('Список аудиторий сохранён.')">Сохранить аудитории</button>
  <p class="small">Даты недель не заполняются автоматически: исходный тариф не содержит календаря семестра.</p>
  </div>`;
}

function v04RenderAll(){renderDashboard();v04RenderLoad();renderStreams();v04RenderSchedule();v04RenderChecks();v04RenderSettings();}

renderLoad=v04RenderLoad;

renderChecks=v04RenderChecks;

v04RenderAll();
</script>


<script>
/* ===== НГХУ v2.6 — constraint-oriented semester optimizer =====
   Source load is preserved. The optimizer distributes each source semester total
   across weeks, then places blocks while enforcing group/teacher/room conflicts.
   It does not invent missing teachers, weeks, or room suitability.
*/
function v05WeeksForStream(s){
  const r=s.rows.find(x=>x[`Часов за семестр ${settings.semester}`]!=null) || s.rows[0];
  const sem=r?.[`Часов за семестр ${settings.semester}`];
  const weeks=r?.[`Недели ${settings.semester}`];
  const weekly=r?.[`Часов/нед ${settings.semester}`];
  return {sem:sem==null?null:Number(sem), weeks:weeks==null?null:Number(weeks), weekly:weekly==null?null:Number(weekly)};
}

function v05AllocateHours(s){
  const q=v05WeeksForStream(s);
  if(q.sem==null || q.weeks==null || q.weeks<=0) return null;
  const total=Math.round(q.sem);
  const base=Math.floor(total/q.weeks);
  const extra=total-base*q.weeks;
  // Spread extra lessons across the semester rather than bunching them.
  const arr=Array(q.weeks).fill(base);
  if(extra>0){
    for(let j=0;j<extra;j++){
      const idx=Math.floor((j+0.5)*q.weeks/extra);
      arr[Math.min(q.weeks-1,idx)]+=1;
    }
  }
  return arr;
}

function v05Key(s){return [s.teacher||"",s.subject||"",s.groups.join("|")].join("¦");}

function v05ExistingFixed(){
  // User-created lessons are kept; generated semester runs from a clean state
  // when the optimizer is explicitly invoked.
  return [];
}

function v05CandidateStarts(day, start, len){
  if(start===4 || start+len>slots.length) return false;
  for(let k=0;k<len;k++) if(start+k===4) return false;
  return true;
}

function v05CanPlace(groups, teacher, room, week, day, start, len, ignore=[]){
  const ignoreSet=new Set(ignore);
  for(let k=0;k<len;k++){
    const candidate={week,day,slot:start+k,groups,teacher,room};
    for(const l of lessons){
      if(ignoreSet.has(l.id)) continue;
      if(v04Conflict(candidate,l)) return false;
    }
  }
  return true;
}

function v05RoomOptions(week,day,start,len){
  const rooms=settings.roomList||[];
  const out=[];
  for(const room of rooms){
    if(v05CanPlace([], "", room, week, day, start, len)) out.push(room);
  }
  return out;
}

function v05GroupLoadAt(group,week,day){
  return lessons.filter(l=>v04WeekOf(l)===week&&l.day===day&&l.groups.includes(group)).length;
}

function v05Score(s,week,day,start,len,room){
  let score=0;
  // Prefer compact blocks for practical work, but never force them.
  if(s.category==="Практическая" && len>1) score+=8;
  // Prefer distributing a group's lessons over days.
  for(const g of s.groups){
    const n=v05GroupLoadAt(g,week,day);
    score-=n*7;
  }
  // Avoid a teacher's excessive same-day concentration.
  if(s.teacher){
    const t=lessons.filter(l=>v04WeekOf(l)===week&&l.day===day&&l.teacher===s.teacher).length;
    score-=t*5;
  }
  // Slightly prefer earlier slots only after constraints are satisfied.
  score-=start*0.15;
  // Prefer rooms that already appear in the room list without implying suitability.
  score += room ? 0.2 : -1000;
  return score;
}

function v05PlaceBlock(s,week,len){
  const candidates=[];
  for(let day=0;day<days.length;day++){
    for(let start=0;start<slots.length;start++){
      if(!v05CandidateStarts(day,start,len)) continue;
      const rooms=settings.roomList||[];
      for(const room of rooms){
        if(!v05CanPlace(s.groups,s.teacher,room,week,day,start,len)) continue;
        candidates.push({day,start,room,score:v05Score(s,week,day,start,len,room)});
      }
    }
  }
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]||null;
}

function v05BlockPattern(s,n){
  const maxBlock=s.category==="Практическая"?Math.max(1,Number(settings.defaultBlockPractical)||2):Math.max(1,Number(settings.defaultBlockTheory)||1);
  const out=[];
  let left=n;
  while(left>0){
    const len=Math.min(maxBlock,left);
    out.push(len);
    left-=len;
  }
  return out;
}

function v05GenerateSemester(){
  const semester=settings.semester;
  const allWeeks=v05WeeksForStream;
  lessons=[];

  const streams=DATA.streams.filter(s=>{
    const q=v05WeeksForStream(s);
    return !!s.teacher && q.weeks!=null && q.sem!=null && q.sem>0 && q.weeks>0;
  });

  // Harder streams first: many groups, high load, then practical blocks.
  streams.sort((a,b)=>{
    const qa=v05WeeksForStream(a), qb=v05WeeksForStream(b);
    return (b.groups.length-a.groups.length) ||
           ((qb.sem/qb.weeks)-(qa.sem/qa.weeks)) ||
           ((b.category==="Практическая")-(a.category==="Практическая"));
  });

  let failed=[];
  for(const s of streams){
    const allocation=v05AllocateHours(s);
    if(!allocation) continue;
    for(let wi=0;wi<allocation.length;wi++){
      const week=wi+1;
      let remaining=allocation[wi];
      const pattern=v05BlockPattern(s,remaining);
      for(const len of pattern){
        const pos=v05PlaceBlock(s,week,len);
        if(!pos){
          // Retry this lesson as single slot. This prevents an oversized block
          // from making an otherwise feasible week fail.
          let single=null;
          if(len>1) single=v05PlaceBlock(s,week,1);
          if(single){
            lessons.push({id:crypto.randomUUID(),week,day:single.day,slot:single.start,
              groups:s.groups,subject:s.subject,teacher:s.teacher,room:single.room,
              streamKey:v05Key(s),generated:true});
            continue;
          }
          failed.push({stream:s,week,hours:len});
          continue;
        }
        for(let k=0;k<len;k++){
          lessons.push({id:crypto.randomUUID(),week,day:pos.day,slot:pos.start+k,
            groups:s.groups,subject:s.subject,teacher:s.teacher,room:pos.room,
            streamKey:v05Key(s),generated:true});
        }
      }
    }
  }
  save();
  settings.v05Failed=failed.length;
  save();
  v05RenderSchedule();
  alert(`Генерация ${semester} семестра завершена.\nСоздано занятий: ${lessons.length}.\nНеразмещённых слотов: ${failed.length}.\n\nНеразмещённые места нужно разобрать вручную: программа не нарушает жёсткие ограничения и не придумывает отсутствующие данные.`);
}

function v05LoadReport(){
  const map=new Map();
  for(const s of DATA.streams){
    const q=v05WeeksForStream(s);
    if(!s.teacher || q.sem==null || q.weeks==null) continue;
    const placed=lessons.filter(l=>l.streamKey===v05Key(s)).length;
    const key=v05Key(s);
    map.set(key,{s,q,placed});
  }
  return [...map.values()];
}

function v05RenderSchedule(){
  const group=settings.currentGroup||"Ж-31";
  const week=Number(settings.currentWeek||1);
  const groupLessons=lessons.filter(l=>v04WeekOf(l)===week&&l.groups.includes(group));
  document.getElementById("schedule").innerHTML=`
  <div class="toolbar">
    <label>Группа <select onchange="settings.currentGroup=this.value;save();v05RenderSchedule()">
      ${DATA.groups.map(g=>`<option ${g===group?"selected":""}>${esc(g)}</option>`).join("")}
    </select></label>
    <label>Неделя <select onchange="settings.currentWeek=Number(this.value);save();v05RenderSchedule()">
      ${v05WeeksForSemester().map(w=>`<option value="${w}" ${w===week?"selected":""}>${w}</option>`).join("")}
    </select></label>
    <button class="btn" onclick="v05GenerateSemester()">⚙ Сгенерировать весь семестр</button>
    <button class="btn" onclick="v05WhatFits()">Что можно поставить сюда?</button>
    <button class="btn" onclick="clearSchedule()">Очистить</button>
  </div>
  <div class="card" style="margin-bottom:12px">
    <b>${semesterLabel()} · неделя ${week}</b>
    <span class="small">Оптимизатор использует семестровые часы из тарифа и распределяет их по неделям. Если исходные недели отсутствуют, запись автоматически не генерируется.</span>
  </div>
  <div class="schedule">
    <div class="head">Время</div>${days.map(d=>`<div class="head">${d}</div>`).join("")}
    ${slots.map((t,si)=>`<div class="time">${t}</div>${days.map((d,di)=>{
      const ls=groupLessons.filter(l=>l.day===di&&l.slot===si);
      return `<div class="cell" onclick="v04AddLesson(${di},${si},'${esc(group)}')">
      ${ls.map(l=>`<div class="lesson ${v04Conflicts(l,l.id).length?'conflict':''}" onclick="event.stopPropagation();v04EditLesson('${l.id}')">
      <b>${esc(l.subject)}</b><br>${esc(l.teacher||"без преподавателя")}<br>${esc(l.room||"ауд. не задана")}
      ${v04Conflicts(l,l.id).length?`<br><span class="bad">КОНФЛИКТ</span>`:""}
      </div>`).join("")}</div>`;
    }).join("")}`).join("")}
  </div>`;
}
function v05WeeksForSemester(){return V04_WEEKS[settings.semester]||V04_WEEKS.I;}
function semesterLabel(){return settings.semester==="I"?"I семестр":"II семестр";}

function v05WhatFits(day=null,slot=null,group=null){

  <div class="toolbar" style="margin-top:12px"><button class="btn" onclick="closeModal()">Закрыть</button></div>`;
  document.getElementById("modal").classList.add("show");
}

  <p class="small">Это уже constraint-oriented эвристический оптимизатор, но не математический solver уровня CP-SAT. Если после генерации остаются неразмещённые часы, их нужно разобрать вручную.</p>

<script>
/* ===== НГХУ v2.6 — quality optimizer =====
   Adds a deterministic local-search improvement stage on top of v0.5.
   Hard conflicts are never accepted. Manual/non-generated lessons are treated
   as fixed; generated lessons may be moved as contiguous blocks.
*/
function v06SameBlock(a,b){
  return a.generated && b.generated &&
    v04WeekOf(a)===v04WeekOf(b) && a.streamKey===b.streamKey &&
    a.day===b.day && a.room===b.room && a.slot+1===b.slot;
}

function v06Blocks(){
  const map=new Map();
  for(const l of lessons){
    if(!l.generated) continue;
    const key=[l.week,l.streamKey,l.day,l.room].join("¦");
    if(!map.has(key)) map.set(key,[]);
    map.get(key).push(l);
  }
  const blocks=[];
  for(const arr of map.values()){
    arr.sort((a,b)=>a.slot-b.slot);
    let cur=[arr[0]];
    for(let i=1;i<arr.length;i++){
      if(arr[i].slot===cur[cur.length-1].slot+1) cur.push(arr[i]);
      else { blocks.push(cur); cur=[arr[i]]; }
    }
    if(cur.length) blocks.push(cur);
  }
  return blocks;
}

function v06Stats(){
  const byGroup=new Map(), byTeacher=new Map();
  for(const l of lessons){
    const wk=v04WeekOf(l), day=l.day;
    for(const g of (l.groups||[])){
      const k=`${wk}¦${g}¦${day}`;
      if(!byGroup.has(k)) byGroup.set(k,[]);
      byGroup.get(k).push(l.slot);
    }
    if(l.teacher){
      const k=`${wk}¦${l.teacher}¦${day}`;
      if(!byTeacher.has(k)) byTeacher.set(k,[]);
      byTeacher.get(k).push(l.slot);
    }
  }
  const calcGaps=map=>{
    let gaps=0, runs=0;
    for(const arr of map.values()){
      arr.sort((a,b)=>a-b);
      const uniq=[...new Set(arr)];
      if(uniq.length<2) continue;
      let min=uniq[0],max=uniq[uniq.length-1];
      const set=new Set(uniq);
      for(let s=min;s<=max;s++) if(!set.has(s)) gaps++;
      for(let i=1;i<uniq.length;i++) if(uniq[i]===uniq[i-1]+1) runs++;
    }
    return {gaps,runs};
  };
  const g=calcGaps(byGroup), t=calcGaps(byTeacher);
  let isolated=0;
  for(const l of lessons){
    if(!l.generated) continue;
    const neighbors=lessons.some(x=>x!==l&&v04WeekOf(x)===v04WeekOf(l)&&
      x.day===l.day&&x.groups.some(g=>(l.groups||[]).includes(g))&&
      Math.abs(x.slot-l.slot)===1);
    if(!neighbors) isolated++;
  }
  return {groupGaps:g.gaps,teacherGaps:t.gaps,consecutive:g.runs+t.runs,isolated};
}

function v06Quality(){
  const s=v06Stats();
  const conflicts=lessons.reduce((n,l)=>n+v04Conflicts(l,l.id).length,0)/2;
  // Lower is better. Hard conflicts carry overwhelming penalty.
  const score=conflicts*10000+s.groupGaps*14+s.teacherGaps*9+s.isolated*2-s.consecutive*0.8;
  return {score,conflicts,...s};
}

function v06MoveBlock(block,newDay,newStart,newRoom){
  const oldDay=block[0].day, oldStart=Math.min(...block.map(x=>x.slot));
  const len=block.length;
  const week=block[0].week;
  const ids=new Set(block.map(x=>x.id));
  for(let k=0;k<len;k++){
    const probe={
      id:"__probe__",week,day:newDay,slot:newStart+k,
      groups:block[0].groups,subject:block[0].subject,
      teacher:block[0].teacher,room:newRoom
    };
    for(const l of lessons){
      if(ids.has(l.id)) continue;
      if(v04Conflict(probe,l)) return false;
    }
  }
  block.forEach((l,k)=>{l.day=newDay;l.slot=newStart+k;l.room=newRoom;});
  return true;
}

function v06Optimize(iterations=700){
  if(!lessons.length){alert("Сначала сгенерируйте расписание.");return;}
  const fixed=lessons.filter(l=>!l.generated);
  if(fixed.length && !confirm(`В расписании есть ${fixed.length} ручных занятий. Они будут зафиксированы, оптимизатор будет менять только автоматически сгенерированные занятия. Продолжить?`)) return;

  let current=v06Quality();
  let accepted=0;
  let rejected=0;
  let seed=20261008;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};

  for(let it=0;it<iterations;it++){
    const blocks=v06Blocks();
    if(!blocks.length) break;
    const block=blocks[Math.floor(rnd()*blocks.length)];
    const len=block.length;
    const week=block[0].week;
    const oldDay=block[0].day, oldStart=block[0].slot, oldRoom=block[0].room;

    const day=Math.floor(rnd()*days.length);
    const maxStart=slots.length-len;
    if(maxStart<0) continue;
    const start=Math.floor(rnd()*(maxStart+1));
    if(start<=4 && start+len>4) continue; // lunch break
    const rooms=settings.roomList||[];
    const room=rooms.length?rooms[Math.floor(rnd()*rooms.length)]:"";

    // Try candidate move; if not improving, revert.
    if(!v06MoveBlock(block,day,start,room)){rejected++;continue;}
    const next=v06Quality();
    if(next.score<=current.score){
      current=next; accepted++;
    }else{
      block.forEach((l,k)=>{l.day=oldDay;l.slot=oldStart+k;l.room=oldRoom;});
      rejected++;
    }
  }
  save();
  v06RenderAll();
  const q=v06Quality();
  alert(`Оптимизация завершена.\n\nКачество: ${q.score.toFixed(1)}\nОкон у групп: ${q.groupGaps}\nОкон у преподавателей: ${q.teacherGaps}\nОдиночных занятий: ${q.isolated}\nПринятых перестановок: ${accepted}\nОтклонённых: ${rejected}\n\nЖёсткие конфликты: ${q.conflicts}.`);
}

<script>
/* ===== НГХУ v1.5 — interactive editor ===== */
let v07DragId=null;

function v07CellLessons(day,slot,week){
  return lessons.filter(l=>v04WeekOf(l)===week&&l.day===day&&l.slot===slot);
}
function v07DragStart(id,ev){
  v07DragId=id;
  if(ev&&ev.dataTransfer){ev.dataTransfer.effectAllowed="move";ev.dataTransfer.setData("text/plain",id);}
}
function v07DragOver(ev){ev.preventDefault(); if(ev.dataTransfer) ev.dataTransfer.dropEffect="move";}
function v07Drop(day,slot,ev){
  ev.preventDefault();
  const id=v07DragId || (ev.dataTransfer&&ev.dataTransfer.getData("text/plain"));
  v07DragId=null;
  if(!id) return;
  v07MoveLessonInteractive(id,day,slot);
}
function v07MoveLessonInteractive(id,day,slot){
  const l=lessons.find(x=>x.id===id); if(!l) return;
  const old={day:l.day,slot:l.slot,room:l.room};
  const len=v07LessonBlockLength(l);
  const options=v07BestPositions(l,day,slot,len,10);
  const exact=options.find(x=>x.day===day&&x.slot===slot);
  if(!exact){
    v07ShowSuggestions(l,options,"В выбранное место поставить нельзя. Вот лучшие варианты:");
    return;
  }
  if(!v06MoveBlock([l],day,slot,exact.room)){
    v07ShowSuggestions(l,options,"Перемещение блокирует другое занятие. Лучшие варианты:");
    return;
  }
  save(); v06RenderAll();
}
function v07LessonBlockLength(l){
  if(!l.generated) return 1;
  let len=1;
  for(let s=l.slot+1;s<slots.length;s++){
    const x=lessons.find(y=>y.generated&&y.id!==l.id&&y.streamKey===l.streamKey&&
      y.week===l.week&&y.day===l.day&&y.room===l.room&&y.slot===s);
    if(x) len++; else break;
  }
  return Math.min(len,Math.max(1,Number(settings.defaultBlockPractical)||2));
}
function v07CandidateScore(l,day,slot,room){
  const probe={...l,day,slot,room};
  if(v04Conflicts(probe,l.id).length) return -1e9;
  let score=100;
  // Prefer fewer same-group classes on the same day.
  for(const g of l.groups||[]){
    const sameDay=lessons.filter(x=>x.id!==l.id&&v04WeekOf(x)===v04WeekOf(l)&&x.day===day&&x.groups.includes(g)).length;
    score-=sameDay*12;
    const sameSlot=lessons.filter(x=>x.id!==l.id&&v04WeekOf(x)===v04WeekOf(l)&&x.day===day&&x.slot===slot&&x.groups.includes(g)).length;
    score-=sameSlot*100;
  }
  if(l.teacher){
    const td=lessons.filter(x=>x.id!==l.id&&v04WeekOf(x)===v04WeekOf(l)&&x.day===day&&x.teacher===l.teacher).length;
    score-=td*8;
  }
  // Prefer positions adjacent to another class of the same group.
  const adjacent=lessons.some(x=>x.id!==l.id&&v04WeekOf(x)===v04WeekOf(l)&&
    x.day===day&&x.groups.some(g=>(l.groups||[]).includes(g))&&Math.abs(x.slot-slot)===1);
  if(adjacent) score+=18;
  score-=slot*.1;
  return score;
}
function v07BestPositions(l,preferredDay=null,preferredSlot=null,len=1,limit=5){
  const out=[];
  for(let day=0;day<days.length;day++){
    for(let slot=0;slot+len<=slots.length;slot++){
      if(slot<=4 && slot+len>4) continue;
      const rooms=settings.roomList||[];
      for(const room of rooms){
        let ok=true;
        for(let k=0;k<len;k++){
          const probe={...l,day,slot:slot+k,room};
          if(v04Conflicts(probe,l.id).length){ok=false;break;}
        }
        if(!ok) continue;
        let score=v07CandidateScore(l,day,slot,room);
        if(preferredDay===day&&preferredSlot===slot) score+=1000;
        out.push({day,slot,room,score});
      }
    }
  }
  out.sort((a,b)=>b.score-a.score);
  const uniq=[], seen=new Set();
  for(const x of out){
    const key=`${x.day}|${x.slot}|${x.room}`;
    if(!seen.has(key)){seen.add(key);uniq.push(x);}
    if(uniq.length>=limit) break;
  }
  return uniq;
}
function v07ShowSuggestions(l,options,title){
  const rows=options.map((x,i)=>`<tr>
    <td>${i+1}</td><td>${days[x.day]}</td><td>${slots[x.slot]}</td><td>${esc(x.room)}</td><td>${x.score.toFixed(1)}</td>
    <td><button class="btn" onclick="v07ApplySuggestion('${l.id}',${x.day},${x.slot},'${esc(x.room)}')">Поставить</button></td>
  </tr>`).join("");
  document.getElementById("modalbox").innerHTML=`
  <h3>${esc(title)}</h3>
  <p><b>${esc(l.subject)}</b> · ${esc(l.teacher||"без преподавателя")} · ${esc((l.groups||[]).join(", "))}</p>
  <div style="max-height:55vh;overflow:auto"><table><thead><tr><th>#</th><th>День</th><th>Время</th><th>Ауд.</th><th>Оценка</th><th></th></tr></thead><tbody>
  ${rows||`<tr><td colspan="6">Допустимых мест не найдено.</td></tr>`}</tbody></table></div>
  <div class="toolbar"><button class="btn" onclick="closeModal()">Закрыть</button></div>`;
  document.getElementById("modal").classList.add("show");
}
function v07ApplySuggestion(id,day,slot,room){
  const l=lessons.find(x=>x.id===id); if(!l) return;
  if(!v06MoveBlock([l],day,slot,room)){alert("Это место больше недоступно.");return;}
  closeModal();save();v06RenderAll();
}
function v07EditSelected(id){
  const l=lessons.find(x=>x.id===id); if(!l)return;
  const opts=v07BestPositions(l,null,null,v07LessonBlockLength(l),5);
  v07ShowSuggestions(l,opts,"5 лучших вариантов для занятия");
}
function v07RenderSchedule(){
  const group=settings.currentGroup||DATA.groups[0];
  const week=Number(settings.currentWeek||1);
  const groupLessons=lessons.filter(l=>v04WeekOf(l)===week&&l.groups.includes(group));
  document.getElementById("schedule").innerHTML=`
  <div class="toolbar">
    <label>Группа <select onchange="settings.currentGroup=this.value;save();v07RenderSchedule()">
      ${DATA.groups.map(g=>`<option ${g===group?"selected":""}>${esc(g)}</option>`).join("")}
    </select></label>
    <label>Неделя <select onchange="settings.currentWeek=Number(this.value);save();v07RenderSchedule()">
      ${v05WeeksForSemester().map(w=>`<option value="${w}" ${w===week?"selected":""}>${w}</option>`).join("")}
    </select></label>
    <button class="btn" onclick="v05GenerateSemester()">⚙ Сгенерировать</button>
    <button class="btn" onclick="v06Optimize(700)">✨ Улучшить</button>
    <button class="btn" onclick="v05WhatFits()">Что можно поставить сюда?</button>
  </div>
  <div class="card" style="margin-bottom:12px">
    <b>${semesterLabel()} · неделя ${week}</b>
    <span class="small">Перетаскивайте занятие мышкой в другую клетку. Если место занято, программа предложит 5 лучших допустимых вариантов.</span>
  </div>
  <div class="schedule">
    <div class="head">Время</div>${days.map(d=>`<div class="head">${d}</div>`).join("")}
    ${slots.map((t,si)=>`<div class="time">${t}</div>${days.map((d,di)=>{
      const ls=groupLessons.filter(l=>l.day===di&&l.slot===si);
      return `<div class="cell" ondragover="v07DragOver(event)" ondrop="v07Drop(${di},${si},event)" onclick="v04AddLesson(${di},${si},'${esc(group)}')">
      ${ls.map(l=>`<div class="lesson ${v04Conflicts(l,l.id).length?'conflict':''}" draggable="true"
        ondragstart="v07DragStart('${l.id}',event)"
        onclick="event.stopPropagation();v07EditSelected('${l.id}')">
      <b>${esc(l.subject)}</b><br>${esc(l.teacher||"без преподавателя")}<br>${esc(l.room||"ауд. не задана")}
      ${v04Conflicts(l,l.id).length?`<br><span class="bad">КОНФЛИКТ</span>`:""}
      <br><span class="small">Нажмите — 5 лучших мест · перетащите — переместить</span>
      </div>`).join("")}</div>`;
    }).join("")}`).join("")}
  </div>`;
}
function v07RenderDashboard(){
  const q=v06Quality();
  document.getElementById("dashboard").innerHTML=`
  <div class="grid">
   <div class="card"><div class="metric">${DATA.meta.group_count}</div><div class="label">групп</div></div>
   <div class="card"><div class="metric">${DATA.meta.stream_count}</div><div class="label">учебных потоков</div></div>
   <div class="card"><div class="metric">${lessons.length}</div><div class="label">занятий</div></div>
   <div class="card"><div class="metric ${q.conflicts?'bad':'good'}">${q.conflicts}</div><div class="label">жёстких конфликтов</div></div>
  </div>
  <div class="card" style="margin-top:12px">
   <h3>v1.5 · интерактивный редактор</h3>
   <div class="kpi"><span>Оценка: ${q.score.toFixed(1)}</span><span>Окон групп: ${q.groupGaps}</span><span>Окон преподавателей: ${q.teacherGaps}</span><span>Одиночных: ${q.isolated}</span></div>
   <p>Теперь расписание можно корректировать вручную: перетаскиванием или через список пяти лучших допустимых мест.</p>
  </div>`;

<script>
/* ===== НГХУ v1.4 — editable directories and load model ===== */
function v08PersistData(){
  localStorage.setItem("nghu_v08_data", JSON.stringify(DATA));
  localStorage.setItem("nghu_v08_settings", JSON.stringify(settings));
}
function v08RestoreData(){
  try{
    const d=JSON.parse(localStorage.getItem("nghu_v08_data")||"null");
    if(d&&d.groups&&d.rows&&d.streams){ DATA=d; }
    const s=JSON.parse(localStorage.getItem("nghu_v08_settings")||"null");
    if(s) Object.assign(settings,s);
  }catch(e){}
}
function v08Unique(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"ru"));}
function v08RebuildDerived(){
  DATA.groups=v08Unique(DATA.rows.flatMap(r=>String(r["Группа"]||"").split(",").map(x=>x.trim()).filter(Boolean)).concat(DATA.groups||[]));
  DATA.teachers=v08Unique(DATA.rows.map(r=>r["Преподаватель"]));
  DATA.subjects=v08Unique(DATA.rows.map(r=>r["Дисциплина"]));
  // Preserve existing stream objects whenever possible; rebuild only missing ones.
  if(!Array.isArray(DATA.streams)) DATA.streams=[];
  DATA.meta=DATA.meta||{};
  DATA.meta.group_count=DATA.groups.length;
  DATA.meta.stream_count=DATA.streams.length;
}
function v08AddRow(){
  const subject=document.getElementById("v08subject").value.trim();
  const teacher=document.getElementById("v08teacher").value.trim();
  const group=document.getElementById("v08group").value.trim();
  const union=document.getElementById("v08union").value.trim();
  if(!subject||!group){alert("Нужно указать дисциплину и группу.");return;}
  const row={"Преподаватель":teacher,"Дисциплина":subject,"Группа":group,
    "Группы исходной записи":union||group,"Объединение":union?"Да":"",
    "Недели I":null,"Недели II":null,"Часов/нед I":null,"Часов/нед II":null,
    "Часов за семестр I":null,"Часов за семестр II":null,"Всего по дисциплине":null,
    "Консультации":null,"ВСЕГО":null,"Источник":"введено в v1.4"};
  DATA.rows.push(row);
  v08RebuildDerived();v08PersistData();v08RenderAll();
}
function v08DeleteRowsByGroup(group){
  if(!confirm(`Удалить из нагрузки все записи группы ${group}? Это нельзя отменить внутри программы.`)) return;
  DATA.rows=DATA.rows.filter(r=>String(r["Группа"]||"").split(",").map(x=>x.trim()).indexOf(group)<0);
  DATA.streams=DATA.streams.filter(s=>!(s.groups||[]).includes(group));
  lessons=lessons.filter(l=>!(l.groups||[]).includes(group));
  v08RebuildDerived();v08PersistData();v08RenderAll();
}
function v08EditRoomList(){
  const value=prompt("Аудитории, по одной на строку:",(settings.roomList||[]).join("\n"));

<script>
/* ===== НГХУ v1.4 — import / validation / export layer ===== */
function v10Esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function v10Num(v){return v===""||v==null?null:Number(v);}
function v10NormalizeHeader(s){return String(s??"").trim().replace(/\s+/g," ");}

function v10ParseCSV(text){
  const rows=[]; let row=[], cell="", quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c==='"'){
      if(quoted && n==='"'){cell+='"';i++;}
      else quoted=!quoted;
    }else if(c===','&&!quoted){row.push(cell);cell="";}
    else if((c==='\n'||c==='\r')&&!quoted){
      if(c==='\r'&&n==='\n')i++;
      row.push(cell);cell="";
      if(row.some(x=>x!==""))rows.push(row);
      row=[];
    }else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function v10RowsFromTable(matrix){
  if(!matrix.length)return [];
  const headers=matrix[0].map(v10NormalizeHeader);
  return matrix.slice(1).filter(r=>r.some(x=>String(x).trim()!=="")).map(r=>{
    const o={};headers.forEach((h,i)=>o[h]=r[i]??"");return o;
  });
}
function v10MapRow(r){
  const find=(...names)=>{
    for(const n of names) if(Object.prototype.hasOwnProperty.call(r,n)) return r[n];
    const keys=Object.keys(r), low=names.map(x=>x.toLowerCase());
    const k=keys.find(x=>low.includes(x.toLowerCase()));
    return k?r[k]:"";
  };
  return {
    "Преподаватель":find("Преподаватель","Преподаватель ФИО"),
    "Дисциплина":find("Дисциплина","Наименование дисциплины"),
    "Группа":find("Группа"),
    "Группы исходной записи":find("Группы исходной записи","Группы"),
    "Объединение":find("Объединение"),
    "Недели I":v10Num(find("Недели I")),
    "Недели II":v10Num(find("Недели II")),
    "Часов/нед I":v10Num(find("Часов/нед I")),
    "Часов/нед II":v10Num(find("Часов/нед II")),
    "Часов за семестр I":v10Num(find("Часов за семестр I")),
    "Часов за семестр II":v10Num(find("Часов за семестр II")),
    "Всего по дисциплине":v10Num(find("Всего по дисциплине")),
    "Консультации":v10Num(find("Консультации")),
    "ВСЕГО":v10Num(find("ВСЕГО")),
    "Источник":"импортировано v1.4"
  };
}
function v10BuildStreams(){
  const map=new Map();
  for(const r of DATA.rows){
    const raw=String(r["Группы исходной записи"]||r["Группа"]||"").trim();
    const groups=v08Unique(raw.split(/[+,;\/]/).map(x=>x.trim()).filter(Boolean));
    if(!groups.length||!r["Дисциплина"])continue;
    const key=[r["Преподаватель"]||"",r["Дисциплина"]||"",groups.join("|")].join("¦");
    if(!map.has(key)){
      map.set(key,{
        key,teacher:r["Преподаватель"]||"",subject:r["Дисциплина"]||"",

      });
    }

  }
  DATA.streams=[...map.values()];

}
function v10Validation(){
  const issues=[];
  DATA.rows.forEach((r,i)=>{
    if(!r["Дисциплина"])issues.push({level:"red",row:i+1,msg:"Не указана дисциплина"});

    if(!r["Преподаватель"])issues.push({level:"red",row:i+1,msg:"Не указан преподаватель"});
    for(const sem of ["I","II"]){
      const w=r[`Недели ${sem}`], h=r[`Часов/нед ${sem}`], total=r[`Часов за семестр ${sem}`];
      if(total!=null&&w==null)issues.push({level:"yellow",row:i+1,msg:`${sem}: есть семестровые часы, но нет количества недель`});
      if(w!=null&&h!=null&&total!=null&&Math.abs(Number(w)*Number(h)-Number(total))>0.51)
        issues.push({level:"yellow",row:i+1,msg:`${sem}: недели × часов/нед не совпадают с семестровыми часами`});
    }
  });
  return issues;
}

<script>
/* ===== НГХУ v1.4 — exact cumulative semester load =====
   The source semester total is authoritative for placement when present.
   Weekly hours are retained as source information and used only as a planning
   signal; discrepancies are reported, never silently corrected.
*/
function v11SemFields(s){
  const rows=s.rows||[];
  let total=null,weeks=null,weekly=null;
  for(const r of rows){
    const t=r[`Часов за семестр ${settings.semester}`];
    const w=r[`Недели ${settings.semester}`];
    const h=r[`Часов/нед ${settings.semester}`];
    if(total==null && t!=null) total=Number(t);
    if(weeks==null && w!=null) weeks=Number(w);
    if(weekly==null && h!=null) weekly=Number(h);
  }
  return {total,weeks,weekly};
}
function v11Allocation(s){
  const q=v11SemFields(s);
  if(q.total==null || q.weeks==null || q.weeks<=0) return null;
  const total=Math.max(0,Math.round(q.total));
  const weeks=Math.round(q.weeks);
  const arr=Array(weeks).fill(0);
  // Exact cumulative target: sum(arr) === source semester total.
  const base=Math.floor(total/weeks), extra=total-base*weeks;
  for(let i=0;i<weeks;i++) arr[i]=base;
  // Spread extra slots as evenly as possible.
  for(let j=0;j<extra;j++){
    const idx=Math.min(weeks-1,Math.floor((j+0.5)*weeks/extra));
    arr[idx]++;
  }
  return arr;
}
function v11PlacedByStream(){
  const m=new Map();
  for(const l of lessons){
    if(!l.streamKey)continue;
    const k=l.streamKey;
    m.set(k,(m.get(k)||0)+1);
  }
  return m;
}
function v11Report(){
  const placed=v11PlacedByStream(), out=[];
  for(const s of DATA.streams){
    const q=v11SemFields(s);
    const alloc=v11Allocation(s);
    if(!alloc) continue;
    const p=placed.get(s.key)||placed.get(v05Key(s))||0;
    const target=alloc.reduce((a,b)=>a+b,0);
    const sourceCheck=(q.weeks!=null&&q.weekly!=null&&q.total!=null)
      ? q.weeks*q.weekly-q.total : null;
    out.push({s,q,alloc,placed:p,target,remaining:target-p,
      sourceCheck});
  }
  return out;
}
function v11GenerateExact(){
  lessons=[];
  const streams=DATA.streams.filter(s=>{
    const q=v11SemFields(s);
    return !!s.teacher && q.total!=null && q.weeks!=null && q.weeks>0;
  });
  streams.sort((a,b)=>{
    const qa=v11SemFields(a),qb=v11SemFields(b);
    return (b.groups.length-a.groups.length) ||
      ((qb.total/qb.weeks)-(qa.total/qa.weeks)) ||
      ((b.category==="Практическая")-(a.category==="Практическая"));
  });
  let failed=[];
  for(const s of streams){
    const allocation=v11Allocation(s);
    if(!allocation)continue;
    for(let wi=0;wi<allocation.length;wi++){
      let left=allocation[wi];
      if(!left)continue;
      const maxBlock=s.category==="Практическая"
        ?Math.max(1,Number(settings.defaultBlockPractical)||2)
        :Math.max(1,Number(settings.defaultBlockTheory)||1);
      while(left>0){
        let len=Math.min(maxBlock,left);
        let pos=v05PlaceBlock(s,wi+1,len);
        if(!pos && len>1) { len=1; pos=v05PlaceBlock(s,wi+1,1); }
        if(!pos){
          failed.push({stream:s,week:wi+1,hours:left});
          break;
        }
        for(let k=0;k<len;k++){
          lessons.push({
            id:crypto.randomUUID(),week:wi+1,day:pos.day,slot:pos.start+k,
            groups:s.groups,subject:s.subject,teacher:s.teacher,room:pos.room,
            streamKey:s.key,generated:true
          });
        }
        left-=len;
      }
    }
  }
  save(); settings.v11Failed=failed;
  v08PersistData();
  v09RenderAll();
  v11RenderReport();
  const unresolved=failed.reduce((a,x)=>a+x.hours,0);
  alert(`Точный семестровый генератор завершён.\n\nПоставлено: ${lessons.length} слотов.\nНе удалось разместить: ${unresolved} слотов.\n\nСумма по каждому сгенерированному потоку контролируется относительно исходных «Часов за семестр».`);
}
function v11RenderReport(){
  const host=document.getElementById("v11_report");if(!host)return;
  const data=v11Report();
  const incomplete=DATA.streams.filter(s=>{
    const q=v11SemFields(s);
    return q.total==null||q.weeks==null;
  });
  const failed=(settings.v11Failed||[]);
  host.innerHTML=`
  <div class="card"><h3>Точный контроль нагрузки · ${semesterLabel()}</h3>
  <p class="small">Важное правило v1.4: если в источнике есть «Часов за семестр», именно это число является целевым количеством слотов для генерации. «Часов/нед» не заменяет семестровый итог.</p>
  <div class="grid">
   <div class="card"><div class="metric">${data.reduce((a,x)=>a+x.target,0)}</div><div class="label">целевых слотов</div></div>
   <div class="card"><div class="metric">${data.reduce((a,x)=>a+x.placed,0)}</div><div class="label">размещено</div></div>
   <div class="card"><div class="metric ${failed.length?'bad':'good'}">${failed.reduce((a,x)=>a+x.hours,0)}</div><div class="label">не размещено</div></div>
   <div class="card"><div class="metric warn">${incomplete.length}</div><div class="label">потоков без полных недель/итога</div></div>
  </div>
  <div style="max-height:55vh;overflow:auto;margin-top:12px">
  <table><thead><tr><th>Поток</th><th>Источник</th><th>Цель</th><th>Поставлено</th><th>Осталось</th><th>Проверка недели × ч/нед</th></tr></thead>
  <tbody>${data.map(x=>{
    const name=`${x.s.subject} · ${x.s.groups.join(" + ")}`;
    const chk=x.sourceCheck==null?"—":(Math.abs(x.sourceCheck)<0.01?"OK":(x.sourceCheck>0?`+${x.sourceCheck}`:`${x.sourceCheck}`));
    return `<tr><td>${v10Esc(name)}</td><td>${v10Esc(x.s.teacher)}</td><td>${x.target}</td><td>${x.placed}</td><td class="${x.remaining?'bad':'good'}">${x.remaining}</td><td>${chk}</td></tr>`;
  }).join("")}</tbody></table></div>
  ${failed.length?`<h4 class="bad">Не размещено</h4>${failed.slice(0,100).map(x=>`<div class="bad">${v10Esc(x.stream.subject)} · ${v10Esc(x.stream.groups.join(" + "))} · неделя ${x.week}: ${x.hours} сл.</div>`).join("")}`:""}
  </div>`;
}
function v11RenderWeekly(){
  const host=document.getElementById("v11_weekly");if(!host)return;
  const rows=v11Report();
  host.innerHTML=`
  <div class="card"><h3>Распределение по неделям</h3>
  <p class="small">Это расчётная таблица. Она показывает, сколько слотов целевой нагрузки распределено на каждую неделю. Даты календарных недель здесь не придумываются.</p>
  <div style="overflow:auto"><table><thead><tr><th>Поток</th>${(v05WeeksForSemester()).map(w=>`<th>Н${w}</th>`).join("")}<th>Итого</th></tr></thead>
  <tbody>${rows.map(x=>`<tr><td>${v10Esc(x.s.subject)}<br><span class="small">${v10Esc(x.s.groups.join(" + "))}</span></td>${x.alloc.map(n=>`<td>${n}</td>`).join("")}<td><b>${x.target}</b></td></tr>`).join("")}</tbody></table></div></div>`;
}
function v11RenderTools(){
  const host=document.getElementById("v11_tools");if(!host)return;
  host.innerHTML=`<div class="card"><h3>v1.1 · точный расчёт</h3>
  <button class="btn" onclick="v11GenerateExact()">⚙ Генерировать по семестровой нагрузке</button>
  <button class="btn" onclick="v06Optimize(1200)">✨ Оптимизировать после генерации</button>
  <p class="small">Записи без преподавателя, без количества недель или без семестрового итога автоматически не генерируются. Они остаются в проверке данных.</p></div>`;
}
function v11RenderAll(){
  v09RenderAll();v10RenderImport();v10RenderScheduleTools();
  v11RenderReport();v11RenderWeekly();v11RenderTools();
}
if(!document.getElementById("v11_report")){
  const app=document.getElementById("v09app");
  app.insertAdjacentHTML("afterend",`
    <div id="v11_tools" class="section"></div>
    <div id="v11_report" class="section"></div>
    <div id="v11_weekly" class="section"></div>`);
}
v11RenderAll();
</script>


<script>
/* ===== НГХУ v1.4 — teaching streams + tariff validation wizard ===== */
function v12StreamId(groups,subject,teacher){
  return [groups.slice().sort().join("|"),subject||"",teacher||""].join("¦");
}
function v12BuildStreams(){
  const map=new Map();
  for(const r of DATA.rows){
    const raw=String(r["Группы исходной записи"]||r["Группа"]||"").trim();
    const groups=v08Unique(raw.split(/[+,;\/]/).map(x=>x.trim()).filter(Boolean));
    if(!groups.length || !r["Дисциплина"]) continue;
    const key=v12StreamId(groups,r["Дисциплина"],r["Преподаватель"]||"");
    if(!map.has(key)){
      map.set(key,{
        id:key,
        groups,
        subject:r["Дисциплина"]||"",
        teacher:r["Преподаватель"]||"",
        unionConfirmed:String(r["Объединение"]||"").trim().toLowerCase() in {"да":1,"yes":1,"true":1} || groups.length>1,
        category:/рисунок|живопись|композици|скульптур|пластичес|дизайн|сидп|макс|фигма|иллюстрац|практик/i.test(r["Дисциплина"]||"")?"Практическая":"Теоретическая",
        rows:[]
      });
    }
    map.get(key).rows.push(r);
  }
  DATA.streams=[...map.values()];
  DATA.meta.stream_count=DATA.streams.length;
}
function v12StreamStatus(s){
  const q=v11SemFields(s);
  const issues=[];
  if(!s.teacher) issues.push("Нет преподавателя");
  if(!s.subject) issues.push("Нет дисциплины");
  if(!s.groups.length) issues.push("Нет группы");
  if(q.total==null) issues.push("Нет часов за семестр");
  if(q.weeks==null) issues.push("Нет количества недель");
  if(q.total!=null&&q.weeks!=null&&q.weekly!=null&&Math.abs(q.weeks*q.weekly-q.total)>0.51)
    issues.push(`Расхождение: ${q.weeks} × ${q.weekly} ≠ ${q.total}`);
  const unionRows=s.rows.filter(r=>String(r["Объединение"]||"").trim());
  if(s.groups.length>1&&!unionRows.length) issues.push("Несколько групп, но объединение не подтверждено");
  return issues;
}
function v12StatusClass(issues){return issues.length? (issues.some(x=>x.startsWith("Нет"))?"bad":"warn"):"good";}
function v12WizardAction(streamId,action){
  const s=DATA.streams.find(x=>x.id===streamId);if(!s)return;
  if(action==="confirmUnion"){s.unionConfirmed=true;}
  if(action==="separate"){
    // Keep source intact; mark only the stream model as separate.
    s.unionConfirmed=false;
  }
  if(action==="assignTeacher"){
    const teachers=v08Unique(DATA.rows.map(r=>r["Преподаватель"]).filter(Boolean));
    const val=prompt("Введите ФИО преподавателя:",teachers[0]||"");
    if(val!==null){
      s.teacher=val;
      s.rows.forEach(r=>r["Преподаватель"]=val);
      DATA.rows.forEach(r=>{
        if(s.rows.includes(r)) r["Преподаватель"]=val;
      });
    }
  }
  if(action==="markDuplicate"){
    s.duplicate=true;
  }
  v08PersistData();v12BuildStreams();v12RenderWizard();
}
function v12RenderWizard(){
  const host=document.getElementById("v12_wizard");if(!host)return;
  v12BuildStreams();
  const streams=DATA.streams;
  const ready=streams.filter(s=>!v12StreamStatus(s).length&&!s.duplicate).length;
  const warnings=streams.filter(s=>v12StreamStatus(s).length&&!v12StreamStatus(s).some(x=>x.startsWith("Нет"))).length;
  const blocked=streams.filter(s=>v12StreamStatus(s).some(x=>x.startsWith("Нет"))&&!s.duplicate).length;
  const dup=streams.filter(s=>s.duplicate).length;
  host.innerHTML=`
  <div class="card"><h3>Мастер проверки учебных потоков</h3>
   <p>Программа разделяет <b>исходную строку тарифа</b> и <b>учебный поток</b>. Никакие расхождения не исправляются автоматически.</p>
   <div class="grid">
    <div class="card"><div class="metric good">${ready}</div><div class="label">готовы к генерации</div></div>
    <div class="card"><div class="metric warn">${warnings}</div><div class="label">требуют проверки</div></div>
    <div class="card"><div class="metric bad">${blocked}</div><div class="label">заблокированы</div></div>
    <div class="card"><div class="metric">${dup}</div><div class="label">помечены дубликатами</div></div>
   </div>
   <div class="toolbar">
    <button class="btn" onclick="v12Filter='all';v12RenderWizard()">Все</button>
    <button class="btn" onclick="v12Filter='bad';v12RenderWizard()">Только проблемы</button>
    <button class="btn" onclick="v12Filter='good';v12RenderWizard()">Только готовые</button>
   </div>
   <div style="max-height:65vh;overflow:auto">
   <table><thead><tr><th>Поток</th><th>Преподаватель</th><th>Группы</th><th>Статус</th><th>Проблемы</th><th>Действия</th></tr></thead>
   <tbody>${streams.filter(s=>{
     const issues=v12StreamStatus(s);
     return !v12Filter || v12Filter==="all" || (v12Filter==="good"&&!issues.length&&!s.duplicate) || (v12Filter==="bad"&&(issues.length||s.duplicate));
   }).map(s=>{
     const issues=v12StreamStatus(s), cls=s.duplicate?"warn":v12StatusClass(issues);
     return `<tr>
      <td><b>${v10Esc(s.subject)}</b><br><span class="small">${s.category}</span></td>
      <td>${v10Esc(s.teacher||"—")}</td>
      <td>${v10Esc(s.groups.join(" + "))}</td>
      <td class="${cls}">${s.duplicate?"Дубликат":issues.length?"Требует проверки":"Готов"}</td>
      <td>${issues.length?issues.map(v10Esc).join("<br>"):"—"}</td>
      <td>
       ${s.groups.length>1?`<button class="btn" onclick="v12WizardAction('${v10Esc(s.id)}','confirmUnion')">Подтвердить объединение</button>
       <button class="btn" onclick="v12WizardAction('${v10Esc(s.id)}','separate')">Разделить</button>`:""}
       ${!s.teacher?`<button class="btn" onclick="v12WizardAction('${v10Esc(s.id)}','assignTeacher')">Назначить преподавателя</button>`:""}
       <button class="btn" onclick="v12WizardAction('${v10Esc(s.id)}','markDuplicate')">Дубликат</button>
      </td>
     </tr>`;
   }).join("")}</tbody></table></div>
  </div>`;
}
let v12Filter="all";
function v12CanGenerate(){
  v12BuildStreams();
  const blocked=DATA.streams.filter(s=>v12StreamStatus(s).some(x=>x.startsWith("Нет"))&&!s.duplicate);
  if(blocked.length){
    alert(`Генерация заблокирована: ${blocked.length} учебных потоков содержат критические проблемы.\n\nСначала обработайте их в мастере проверки.`);
    v12RenderWizard();return false;
  }
  return true;
}

<script>
/* ===== НГХУ v1.4 — room types, capacities and discipline requirements ===== */
function v13DefaultRooms(){
  return (settings.roomList||[]).map(name=>({
    name,capacity:null,type:"Не задан",features:[],available:true
  }));
}
function v13Rooms(){
  if(!Array.isArray(settings.roomsMeta)||!settings.roomsMeta.length){
    settings.roomsMeta=v13DefaultRooms();
  }
  const names=new Set((settings.roomList||[]));
  settings.roomsMeta=settings.roomsMeta.filter(r=>names.has(r.name));
  (settings.roomList||[]).forEach(name=>{
    if(!settings.roomsMeta.some(r=>r.name===name))
      settings.roomsMeta.push({name,capacity:null,type:"Не задан",features:[],available:true});
  });
  return settings.roomsMeta;
}
function v13Requirements(){
  if(!settings.subjectRequirements)settings.subjectRequirements={};
  return settings.subjectRequirements;
}
function v13RoomFits(subject,groups,room){
  const meta=v13Rooms().find(r=>r.name===room);
  if(!meta || meta.available===false)return false;
  const req=v13Requirements()[subject]||{};
  const groupCount=groups.length;
  if(req.capacity!=null && meta.capacity!=null && Number(meta.capacity)<Number(req.capacity))return false;
  if(req.type && req.type!=="Не задан" && meta.type!=="Не задан" && req.type!==meta.type)return false;
  const need=req.features||[];
  if(need.length && meta.features && !need.every(x=>meta.features.includes(x)))return false;
  return true;
}
function v13RoomScore(subject,groups,room){
  if(!v13RoomFits(subject,groups,room))return -1e9;
  const meta=v13Rooms().find(r=>r.name===room),req=v13Requirements()[subject]||{};
  let score=0;
  if(meta.type!=="Не задан" && req.type===meta.type)score+=20;
  if(req.capacity!=null&&meta.capacity!=null)score+=Math.max(0,50-(meta.capacity-req.capacity));
  if((req.features||[]).length)score+=10;
  return score;
}
const v13OldPlaceBlock=v05PlaceBlock;
v05PlaceBlock=function(s,week,len){
  const candidates=[];

    for(let start=0;start+len<=slots.length;start++){
      if(start<=4&&start+len>4)continue;

        if(!v13RoomFits(s.subject,s.groups,room))continue;
        if(!v05CanPlace(s.groups,s.teacher,room,week,day,start,len))continue;
        candidates.push({day,start,room,
          score:v05Score(s,week,day,start,len,room)+v13RoomScore(s.subject,s.groups,room)});
      }
    }
  }
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]||null;
};

<script>
/* ===== НГХУ v1.4 — availability calendars and exceptions ===== */
function v14Availability(){
  if(!settings.availability)settings.availability={teachers:{},groups:{},rooms:{}};
  return settings.availability;
}
function v14Entry(kind,name){
  const a=v14Availability();
  if(!a[kind][name])a[kind][name]={blocked:[],preferred:[]};
  return a[kind][name];
}
function v14IsBlocked(kind,name,week,day,slot){
  if(!name)return false;
  const e=v14Entry(kind,name);
  return (e.blocked||[]).some(x=>Number(x.week||0)===Number(week||0)&&
    Number(x.day)===Number(day)&&Number(x.slot)===Number(slot));
}
function v14IsPreferred(kind,name,week,day,slot){
  if(!name)return false;
  const e=v14Entry(kind,name);
  return (e.preferred||[]).some(x=>Number(x.week||0)===Number(week||0)&&
    Number(x.day)===Number(day)&&Number(x.slot)===Number(slot));
}
function v14CanPlace(s,week,day,start,len){
  for(let k=0;k<len;k++){
    const sl=start+k;
    if(v14IsBlocked("teachers",s.teacher,week,day,sl))return false;
    for(const g of s.groups||[])if(v14IsBlocked("groups",g,week,day,sl))return false;
  }
  return true;
}
const v14OldPlace=v05PlaceBlock;
v05PlaceBlock=function(s,week,len){
  const candidates=[];
  for(let day=0;day<days.length;day++){
    for(let start=0;start+len<=slots.length;start++){
      if(start<=4&&start+len>4)continue;
      if(!v14CanPlace(s,week,day,start,len))continue;
      for(const room of settings.roomList||[]){
        if(!v13RoomFits(s.subject,s.groups,room))continue;
        if(!v05CanPlace(s.groups,s.teacher,room,week,day,start,len))continue;
        let score=v05Score(s,week,day,start,len,room)+v13RoomScore(s.subject,s.groups,room);
        if(v14IsPreferred("teachers",s.teacher,week,day,start))score+=15;
        if((s.groups||[]).some(g=>v14IsPreferred("groups",g,week,day,start)))score+=8;
        candidates.push({day,start,room,score});
      }
    }
  }
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]||null;
};
function v14SetRule(kind,name,mode){
  const weeks=v05WeeksForSemester(), week=Number(settings.currentWeek||1);

function v15DateKey(d){return d.toISOString().slice(0,10)}
function v15Monday(d){
  const x=new Date(d+"T00:00:00"), n=(x.getDay()+6)%7;

}
function v15BuildWeeks(){

function v15Exception(date){

<script>
/* ===== НГХУ v2.6 — date-based semester generation ===== */
function v16WeeksForSemester(){
  const c=v15Calendar();
  const start=v15Monday(c.scheduleStart);
  const n=Number(settings.semester||1)===1?16:20;
  return Array.from({length:n},(_,i)=>{
    const d=new Date(start);d.setDate(start.getDate()+i*7);
    return {week:i+1,start:v15DateKey(d),end:v15DateKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()+5))};
  });
}
function v16DateFor(week,day){
  const w=v16WeeksForSemester().find(x=>x.week===Number(week));
  if(!w)return null;
  const d=new Date(w.start+"T00:00:00");d.setDate(d.getDate()+Number(day));
  return v15DateKey(d);
}
function v16IsBlocked(week,day){
  const date=v16DateFor(week,day);
  if(!date)return true;
  return v15IsDateUnavailable(date);
}
function v16PlaceDateAware(s,week,len){
  const candidates=[];
  for(let day=0;day<days.length;day++){
    if(v16IsBlocked(week,day))continue;
    for(let start=0;start+len<=slots.length;start++){
      if(start<=4&&start+len>4)continue;
      if(!v14CanPlace(s,week,day,start,len))continue;
      for(const room of settings.roomList||[]){
        if(!v13RoomFits(s.subject,s.groups,room))continue;
        if(v05CanPlace(s.groups,s.teacher,room,week,day,start,len)){
          let score=v05Score(s,week,day,start,len,room)+v13RoomScore(s.subject,s.groups,room);
          if(v14IsPreferred("teachers",s.teacher,week,day,start))score+=15;
          if((s.groups||[]).some(g=>v14IsPreferred("groups",g,week,day,start)))score+=8;
          candidates.push({week,day,start,room,date:v16DateFor(week,day),score});
        }
      }
    }
  }
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]||null;
}
function v16GenerateDates(){
  if(typeof v11Allocation!=="function"){alert("Модуль точной нагрузки v1.1 не найден.");return;}
  const semester=Number(settings.semester||1);
  const weeks=v16WeeksForSemester();
  const streams=(DATA.streams||[]).filter(s=>s&&s.teacher&&s.groups&&s.groups.length);
  const generated=[];
  for(const s of streams){
    const total=Number(s.semesterTotal||0);
    if(!total)continue;
    let remaining=total;
    const allocation=v11Allocation(s,semester);
    for(const a of allocation){
      let need=Number(a.hours||0);
      if(!need)continue;
      const len=Math.max(1,Number(s.blockLength||1));
      while(need>0){
        const p=v16PlaceDateAware(s,a.week,Math.min(len,need));
        if(!p)break;
        generated.push({...s,week:a.week,day:p.day,start:p.start,room:p.room,date:p.date,
          instanceId:"v16_"+Math.random().toString(36).slice(2)});
        need-=Math.min(len,need);remaining-=Math.min(len,need);
      }
    }
    if(remaining>0)console.warn("Осталась нагрузка:",s.subject,s.groups,remaining);
  }
  DATA.lessons=generated;
  v08PersistData();
  if(typeof renderAll==="function")renderAll();
  v16RenderReport(generated);
}

 const host=document.getElementById("v16_report");if(!host)return;

 <p class="small">Если часть нагрузки не разместилась, она не удаляется из тарифа — это означает, что для неё не найдено допустимое место при текущих ограничениях.</p>

}

<script>
/* ===== НГХУ v2.6 — диспетчер расписания ===== */
function v17Lessons(){return DATA.lessons||[]}

function v17Conflicts(lesson,ignoreIndex=-1){
  const out=[];
  v17Lessons().forEach((x,i)=>{
    if(i===ignoreIndex || x.week!==lesson.week || x.day!==lesson.day) return;
    const a1=lesson.start, a2=lesson.start+(lesson.blockLength||1);
    const b1=x.start, b2=x.start+(x.blockLength||1);
    if(a1>=b2 || b1>=a2) return;
    if(lesson.teacher && lesson.teacher===x.teacher) out.push({type:"Преподаватель",x});
    if(lesson.room && lesson.room===x.room) out.push({type:"Аудитория",x});
    if((lesson.groups||[]).some(g=>(x.groups||[]).includes(g)))
      out.push({type:"Группа",x});
  });
  if(v14IsBlocked("teachers",lesson.teacher,lesson.week,lesson.day,lesson.start))
    out.push({type:"Запрет преподавателя"});
  (lesson.groups||[]).forEach(g=>{
    if(v14IsBlocked("groups",g,lesson.week,lesson.day,lesson.start))
      out.push({type:"Запрет группы",group:g});
  });
  if(v14IsBlocked("rooms",lesson.room,lesson.week,lesson.day,lesson.start))
    out.push({type:"Запрет аудитории"});
  if(v16IsBlocked(lesson.week,lesson.day)) out.push({type:"Дата закрыта"});
  return out;
}

function v17Move(index,week,day,start,room){
  const l=v17Lessons()[index];
  if(!l)return;
  const n={...l,week:Number(week),day:Number(day),start:Number(start),room};
  const c=v17Conflicts(n,index);
  if(c.length){
    alert("Перенос невозможен:\n"+c.map(x=>x.type+(x.group?": "+x.group:"")).join("\n"));
    return;
  }
  DATA.lessons[index]=n;
  v08PersistData();
  v17Render();
}

function v17Alternatives(index){
  const l=v17Lessons()[index], out=[];
  if(!l)return out;
  const maxWeek=Number(settings.semester||1)===1?16:20;
  for(let w=1;w<=maxWeek;w++){
    for(let d=0;d<days.length;d++){
      if(v16IsBlocked(w,d))continue;
      for(let s=0;s<slots.length;s++){
        const len=Math.max(1,l.blockLength||1);
        if(s+len>slots.length || (s<=4 && s+len>4))continue;
        for(const room of settings.roomList||[]){
          const n={...l,week:w,day:d,start:s,room};
          if(!v17Conflicts(n,index).length){
            let score=0;
            if(v14IsPreferred("teachers",l.teacher,w,d,s))score+=20;
            if((l.groups||[]).some(g=>v14IsPreferred("groups",g,w,d,s)))score+=10;
            score-=Math.abs(w-l.week)*.2;
            out.push({...n,score,date:v16DateFor(w,d)});
          }
        }
      }
    }
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,12);
}

function v17ShowLesson(i){
  const l=v17Lessons()[i], alts=v17Alternatives(i);
  const html=`<div class="card">
    <h3>${v10Esc(l.subject||"Занятие")}</h3>
    <p><b>${v10Esc((l.groups||[]).join(", "))}</b> · ${v10Esc(l.teacher||"—")}</p>
    <p>Текущее: ${l.date||v16DateFor(l.week,l.day)||""}, ${days[l.day]}, ${slots[l.start]||""}, ауд. ${v10Esc(l.room||"—")}</p>
    <h4>Конфликты</h4>
    <div>${v17Conflicts(l,i).map(x=>`<span class="tag danger">${v10Esc(x.type)}${x.group?": "+v10Esc(x.group):""}</span>`).join(" ")||"Нет"}</div>
    <h4>Допустимые варианты</h4>
    <table><thead><tr><th>Дата</th><th>День</th><th>Пара</th><th>Ауд.</th><th></th></tr></thead>
    <tbody>${alts.map(a=>`<tr>
      <td>${a.date}</td><td>${days[a.day]}</td><td>${slots[a.start]}</td><td>${v10Esc(a.room)}</td>
      <td><button class="btn" onclick="v17Move(${i},${a.week},${a.day},${a.start},${JSON.stringify(a.room)});v17Close()">Поставить</button></td>
    </tr>`).join("")}</tbody></table>
  </div>`;
  v17Modal(html);
}

function v17Modal(html){
  let m=document.getElementById("v17_modal");
  if(!m){
    m=document.createElement("div");
    m.id="v17_modal";
    m.className="modal";
    document.body.appendChild(m);
  }
  m.innerHTML=`<div class="modalBox">${html}<button class="btn" onclick="v17Close()">Закрыть</button></div>`;
  m.style.display="flex";
}
function v17Close(){
  const m=document.getElementById("v17_modal");
  if(m)m.style.display="none";
}

function v17Render(){
  const host=document.getElementById("v17_dispatch");
  if(!host)return;
  const lessons=v17Lessons();
  const w=Number(settings.currentWeek||1);
  const rows=lessons.map((x,i)=>({...x,_i:i}))
    .filter(x=>x.week===w)
    .sort((a,b)=>a.day-b.day||a.start-b.start);
  const conflicts=rows.flatMap(x=>v17Conflicts(x,x._i).map(c=>({...c,l:x})));

  host.innerHTML=`<div class="card">
    <h3>v2.6 · диспетчер расписания</h3>
    <div class="toolbar">
      <label>Неделя
        <select onchange="settings.currentWeek=Number(this.value);v17Render()">
          ${Array.from({length:Number(settings.semester||1)===1?16:20},(_,i)=>
            `<option value="${i+1}" ${i+1===w?"selected":""}>${i+1}</option>`).join("")}
        </select>
      </label>
      <button class="btn" onclick="v16GenerateDates();v17Render()">🚀 Перегенерировать</button>
      <button class="btn" onclick="v15RenderCalendar()">📅 Календарь</button>
    </div>
    <div class="grid2">
      <div>
        <h4>Занятия недели ${w}</h4>
        <div style="max-height:55vh;overflow:auto">
          <table><thead><tr><th>Дата</th><th>Время</th><th>Группа</th><th>Дисциплина</th><th>Преподаватель</th><th>Ауд.</th><th></th></tr></thead>
          <tbody>${rows.map(x=>`<tr>
            <td>${x.date||v16DateFor(x.week,x.day)||""}</td>
            <td>${slots[x.start]||""}</td>
            <td>${v10Esc((x.groups||[]).join(", "))}</td>
            <td>${v10Esc(x.subject||"")}</td>
            <td>${v10Esc(x.teacher||"")}</td>
            <td>${v10Esc(x.room||"")}</td>
            <td><button class="btn" onclick="v17ShowLesson(${x._i})">Перенести</button></td>
          </tr>`).join("")||"<tr><td colspan='7'>Нет занятий</td></tr>"}</tbody>
          </table>
        </div>
      </div>
      <div>
        <h4>Диагностика</h4>
        <div class="notice">${conflicts.length?`Найдено нарушений: <b>${conflicts.length}</b>`:"Конфликтов не обнаружено."}</div>
        ${conflicts.slice(0,30).map(c=>`<div class="issue"><b>${v10Esc(c.type)}</b> — ${v10Esc(c.l.subject||"")}</div>`).join("")}
      </div>
    </div>
  </div>`;
}

if(!document.getElementById("v17_dispatch")){
  document.body.insertAdjacentHTML("beforeend",`<div id="v17_dispatch" class="section"></div>`);
}
v17Render();
</script>

<script>
/* ===== НГХУ v2.6 — аудит исходной нагрузки ===== */
function v20Num(x){return x===""||x==null||Number.isNaN(Number(x))?null:Number(x)}
function v20AuditRows(){
  const rows=DATA.rows||[];
  const out=[];
  rows.forEach((r,i)=>{
    const teacher=(r["Преподаватель"]||"").trim();
    const subject=(r["Дисциплина"]||"").trim();
    const group=(r["Группа"]||"").trim();
    const wi=v20Num(r["Недели I"]), wii=v20Num(r["Недели II"]);
    const hi=v20Num(r["Часов/нед I"]), hii=v20Num(r["Часов/нед II"]);
    const si=v20Num(r["Часов за семестр I"]), sii=v20Num(r["Часов за семестр II"]);
    const total=v20Num(r["Всего по дисциплине"]);
    const flags=[];
    if(!teacher)flags.push({type:"blocked",text:"Не указан преподаватель"});
    if(!subject)flags.push({type:"blocked",text:"Не указана дисциплина"});
    if(!group)flags.push({type:"blocked",text:"Не указана группа"});
    if((hi!=null&&wi!=null&&si!=null)&&Math.abs(hi*wi-si)>.51)
      flags.push({type:"warning",text:`I: ${wi} × ${hi} ≠ ${si}`});
    if((hii!=null&&wii!=null&&sii!=null)&&Math.abs(hii*wii-sii)>.51)
      flags.push({type:"warning",text:`II: ${wii} × ${hii} ≠ ${sii}`});
    if((si!=null&&sii!=null&&total!=null)&&Math.abs(si+sii-total)>.51)
      flags.push({type:"warning",text:`I+II ≠ всего (${si}+${sii} ≠ ${total})`});

<script>
/* ===== НГХУ v2.6 — генерация по подтверждённым учебным потокам ===== */
function v23ActiveStreams(){
  return (DATA.streams||[]).filter(s=>s.confirmed && s.teacher && s.groups && s.groups.length);
}
function v23LoadForStream(s,semester){
  const rows=(s.rows||[]).map(i=>(DATA.rows||[])[i]).filter(Boolean);
  let total=0, weeks=0, weekly=0;
  rows.forEach(r=>{
    if(semester===1){
      total+=v20Num(r["Часов за семестр I"])||0;
      weeks=Math.max(weeks,v20Num(r["Недели I"])||0);
      weekly=Math.max(weekly,v20Num(r["Часов/нед I"])||0);
    }else{
      total+=v20Num(r["Часов за семестр II"])||0;
      weeks=Math.max(weeks,v20Num(r["Недели II"])||0);
      weekly=Math.max(weekly,v20Num(r["Часов/нед II"])||0);
    }
  });
  return {total,weeks,weekly};
}
function v23Generate(){
  const streams=v23ActiveStreams(), semester=Number(settings.semester||1);
  if(!streams.length){
    alert("Нет подтверждённых учебных потоков с преподавателем. Сначала подтвердите потоки в v2.2.");
    return;
  }
  const lessons=[];
  const problems=[];
  streams.forEach(s=>{
    const load=v23LoadForStream(s,semester);
    if(!load.total){
      problems.push({s,reason:"Нет семестровой нагрузки для выбранного семестра"});
      return;
    }
    const weeks=load.weeks || (semester===1?16:20);
    const base=Math.floor(load.total/weeks), extra=load.total%weeks;
    let placed=0;
    for(let wi=1;wi<=weeks;wi++){
      let need=base+(wi<=extra?1:0);
      while(need>0){
        const len=Math.min(Math.max(1,Number(s.blockLength||1)),need);
        const pseudo={...s,subject:s.subject,teacher:s.teacher,groups:s.groups};
        const p=v16PlaceDateAware(pseudo,wi,len);
        if(!p){problems.push({s,reason:"Не найдено допустимое место на неделе "+wi,remaining:need});break;}
        lessons.push({...pseudo,week:wi,day:p.day,start:p.start,room:p.room,date:p.date,
          blockLength:len,streamId:s.id,sourceRows:s.rows});
        placed+=len;need-=len;
      }
    }
    if(placed<load.total)problems.push({s,reason:"Осталось неразмещённой нагрузки: "+(load.total-placed)});
  });
  DATA.lessons=lessons;
  v08PersistData();
  v23RenderResult(problems,lessons.length);
  if(typeof v17Render==="function")v17Render();
  if(typeof v18RenderGrid==="function")v18RenderGrid();
}

 <h4>Неразмещённая нагрузка / проблемы</h4>
 ${problems.length?`<div>${problems.map(p=>`<div class="issue"><b>${v10Esc(p.s.subject||"")}</b> · ${v10Esc((p.s.groups||[]).join(" + "))} — ${v10Esc(p.reason)}</div>`).join("")}</div>`:"<div class='notice'>Все рассчитанные потоки получили места при текущих ограничениях.</div>"}
 </div>`;
}
