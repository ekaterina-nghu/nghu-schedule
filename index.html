<script>
/* ===== НГХУ v2.6 — источники нагрузки внутри учебного потока ===== */
function v24Sources(stream){
  return (stream.rows||[]).map(i=>({index:i,row:(DATA.rows||[])[i]})).filter(x=>x.row);
}
function v24SourceLoad(row,semester){
  const suf=semester===1?" I":" II";
  return {
    weeks:v20Num(row["Недели"+suf]),
    weekly:v20Num(row["Часов/нед"+suf]),
    semester:v20Num(row["Часов за семестр"+suf])
  };
}
function v24SourceStatus(row,semester,placed){
  const l=v24SourceLoad(row,semester);
  const target=l.semester;
  if(target==null)return {status:"blocked",text:"Нет семестрового объёма"};
  const rest=Math.max(0,target-(placed||0));
  return {status:rest===0?"done":"open",text:rest===0?"Выполнено":"Осталось "+rest+" ч."};
}
function v24BuildLedger(){
  const semester=Number(settings.semester||1);
  const ledger=[];
  (DATA.streams||[]).filter(s=>s.confirmed).forEach(s=>{
    v24Sources(s).forEach(src=>{
      const l=v24SourceLoad(src.row,semester);
      ledger.push({
        streamId:s.id,rowIndex:src.index,subject:src.row["Дисциплина"]||s.subject,
        teacher:s.teacher,groups:s.groups,load:l,target:l.semester,placed:0
      });
    });
  });
  (DATA.lessons||[]).forEach(x=>{
    const rows=x.sourceRows||[];
    rows.forEach(i=>{
      const item=ledger.find(z=>z.rowIndex===i&&z.streamId===x.streamId);
      if(item)item.placed+=Number(x.blockLength||1);
    });
  });
  return ledger;
}
function v24RenderLedger(){
  const host=document.getElementById("v24_ledger");if(!host)return;
  const ledger=v24BuildLedger();
  host.innerHTML=`<div class="card">
   <h3>v2.6 · точный учёт нагрузки</h3>
   <p class="small">Каждая исходная строка тарифа учитывается отдельно. Часы разных источников не смешиваются автоматически.</p>
   <div style="max-height:60vh;overflow:auto"><table><thead><tr>
    <th>Источник</th><th>Дисциплина</th><th>Группы</th><th>Преподаватель</th><th>Цель</th><th>Поставлено</th><th>Остаток</th><th>Статус</th>
   </tr></thead><tbody>
   ${ledger.map(x=>{
     const rest=x.target==null?null:Math.max(0,x.target-x.placed);
     const status=x.target==null?"🔴":rest===0?"🟢":"🟠";
     return `<tr><td>№${x.rowIndex+1}</td><td>${v10Esc(x.subject)}</td><td>${v10Esc((x.groups||[]).join(" + "))}</td><td>${v10Esc(x.teacher||"")}</td>
       <td>${x.target??"—"}</td><td>${x.placed}</td><td>${rest??"—"}</td><td>${status}</td></tr>`;
   }).join("")||"<tr><td colspan='8'>Нет подтверждённых потоков</td></tr>"}
   </tbody></table></div>
  </div>`;
}
function v24GenerateExact(){
  const streams=(DATA.streams||[]).filter(s=>s.confirmed&&s.teacher&&s.groups?.length);
  const semester=Number(settings.semester||1);
  const lessons=[], problems=[];
  streams.forEach(s=>{
    v24Sources(s).forEach(src=>{
      const l=v24SourceLoad(src.row,semester);
      if(l.semester==null){problems.push({s,src,reason:"Нет семестрового объёма"});return;}
      let remaining=l.semester;
      const weeks=l.weeks||0;
      if(!weeks){problems.push({s,src,reason:"Не указаны недели"});return;}
      for(let w=1;w<=weeks&&remaining>0;w++){
        let need=Math.min(Math.max(1,Math.round(remaining/weeks)),remaining);
        while(need>0){
          const len=Math.min(Math.max(1,Number(s.blockLength||1)),need);
          const pseudo={...s,subject:src.row["Дисциплина"]||s.subject,sourceRows:[src.index]};
          const p=v16PlaceDateAware(pseudo,w,len);
          if(!p){problems.push({s,src,reason:"Не найдено место на неделе "+w,remaining:need});break;}
          lessons.push({...pseudo,week:w,day:p.day,start:p.start,room:p.room,date:p.date,blockLength:len,streamId:s.id});
          remaining-=len;need-=len;
        }
      }
      if(remaining>0)problems.push({s,src,reason:"Осталось "+remaining+" ч."});
    });
  });
  DATA.lessons=lessons;v08PersistData();
  v24RenderLedger();

}

<script>
/* ===== НГХУ v2.6 — точное распределение нагрузки по неделям ===== */
function v25Distribution(total,weeks){
  total=Number(total);weeks=Number(weeks);
  if(!Number.isFinite(total)||!Number.isFinite(weeks)||weeks<=0)return [];
  const base=Math.floor(total/weeks), rem=total-base*weeks;
  const out=Array(weeks).fill(base);
  /* Остаток распределяется максимально равномерно, без изменения общего итога. */
  if(rem){
    const step=weeks/rem;
    for(let i=0;i<rem;i++){
      let idx=Math.min(weeks-1,Math.floor(i*step));
      while(out[idx]>base)idx++;
      out[idx]++;
    }
  }
  return out;
}
function v25VerifyDistribution(total,dist){
  return dist.reduce((a,b)=>a+b,0)===Number(total);
}
function v25Render(){
 const host=document.getElementById("v25_distribution");if(!host)return;
 const semester=Number(settings.semester||1);
 const rows=[];
 (DATA.streams||[]).filter(s=>s.confirmed).forEach(s=>{
   v24Sources(s).forEach(src=>{
     const l=v24SourceLoad(src.row,semester);
     if(l.semester!=null&&l.weeks){
       const d=v25Distribution(l.semester,l.weeks);
       rows.push({s,src,l,d});
     }
   });
 });
 host.innerHTML=`<div class="card">
 <h3>v2.6 · распределение нагрузки по неделям</h3>
 <p class="small">Недельная цифра здесь является результатом распределения семестрового объёма. Исходные «часов/нед» не переписываются.</p>
 <div style="max-height:65vh;overflow:auto"><table><thead><tr><th>Источник</th><th>Дисциплина</th><th>Группы</th><th>Всего</th><th>Нед.</th><th>Распределение</th><th>Проверка</th></tr></thead><tbody>
 ${rows.map(x=>`<tr>
 <td>№${x.src.index+1}</td><td>${v10Esc(x.src.row["Дисциплина"]||"")}</td>
 <td>${v10Esc((x.s.groups||[]).join(" + "))}</td><td>${x.l.semester}</td><td>${x.l.weeks}</td>
 <td>${x.d.join(" · ")}</td><td>${v25VerifyDistribution(x.l.semester,x.d)?"🟢 Точно":"🔴 Ошибка"}</td>
 </tr>`).join("")||"<tr><td colspan='7'>Нет подтверждённых источников с полными данными</td></tr>"}
 </tbody></table></div>
 </div>`;
}
function v25Generate(){
 const streams=(DATA.streams||[]).filter(s=>s.confirmed&&s.teacher&&s.groups?.length);
 const semester=Number(settings.semester||1);
 const lessons=[],problems=[];
 streams.forEach(s=>{
   v24Sources(s).forEach(src=>{
     const l=v24SourceLoad(src.row,semester);
     if(l.semester==null){problems.push({s,src,reason:"Нет семестрового объёма"});return;}
     if(!l.weeks){problems.push({s,src,reason:"Не указаны недели"});return;}
     const dist=v25Distribution(l.semester,l.weeks);
     if(!v25VerifyDistribution(l.semester,dist)){problems.push({s,src,reason:"Ошибка распределения"});return;}
     dist.forEach((need,w0)=>{
       let remaining=need, w=w0+1;
       while(remaining>0){
         const len=Math.min(Math.max(1,Number(s.blockLength||1)),remaining);
         const pseudo={...s,subject:src.row["Дисциплина"]||s.subject,sourceRows:[src.index]};
         const p=v16PlaceDateAware(pseudo,w,len);
         if(!p){problems.push({s,src,reason:"Не найдено место на неделе "+w,remaining});break;}
         lessons.push({...pseudo,week:w,day:p.day,start:p.start,room:p.room,date:p.date,blockLength:len,streamId:s.id});
         remaining-=len;
       }
     });
   });
 });
 DATA.lessons=lessons;v08PersistData();
 v24RenderLedger();v24RenderProblems(problems);v25Render();
 if(typeof v17Render==="function")v17Render();
 if(typeof v18RenderGrid==="function")v18RenderGrid();
}
if(!document.getElementById("v25_distribution")){
 document.body.insertAdjacentHTML("beforeend",'<div id="v25_distribution" class="section"></div>');
}
v25Render();
</script>


<script>
/* ===== НГХУ v2.6 — оптимизация расписания ===== */
function v26DayLoad(lessons,key,day){
  return lessons.filter(x=>x[key]===day).length;
}
function v26GroupGap(lessons,group,day){
  const s=lessons.filter(x=>x.day===day&&(x.groups||[]).includes(group)).map(x=>x.start).sort((a,b)=>a-b);
  if(s.length<2)return 0;
  let gap=0;for(let i=1;i<s.length;i++)gap+=Math.max(0,s[i]-s[i-1]-1);
  return gap;
}
function v26ScoreCandidate(c,current){
  let score=c.score||0;
  const sameDay=current.filter(x=>x.week===c.week&&x.day===c.day);
  if(sameDay.length>=4)score-=12*(sameDay.length-3);
  for(const g of c.groups||[])score-=8*v26GroupGap(current,g,c.day);
  if(c.start===0)score+=2;
  if(c.start===slots.length-1)score-=2;
  return score;
}
function v26Candidates(s,week,len,current){
  const out=[];
  for(let d=0;d<days.length;d++){
    if(v16IsBlocked(week,d))continue;
    for(let st=0;st+len<=slots.length;st++){
      if(st<=4&&st+len>4)continue;
      for(const room of settings.roomList||[]){
        const n={...s,week,day:d,start:st,room,blockLength:len};
        if(v17Conflicts(n,-1).length)continue;
        if(!v13RoomFits(s.subject,s.groups,room))continue;
        let score=v26ScoreCandidate(n,current);
        if(v14IsPreferred("teachers",s.teacher,week,d,st))score+=20;
        if((s.groups||[]).some(g=>v14IsPreferred("groups",g,week,d,st)))score+=10;
        out.push({...n,score,date:v16DateFor(week,d)});
      }
    }
  }
  return out.sort((a,b)=>b.score-a.score);
}
function v26GenerateOptimized(){
  const streams=(DATA.streams||[]).filter(s=>s.confirmed&&s.teacher&&s.groups?.length);
  const semester=Number(settings.semester||1), lessons=[], problems=[];
  const tasks=[];
  streams.forEach(s=>{
    v24Sources(s).forEach(src=>{
      const l=v24SourceLoad(src.row,semester);
      if(l.semester==null||!l.weeks){
        problems.push({s,src,reason:l.semester==null?"Нет семестрового объёма":"Не указаны недели"});
        return;
      }
      const dist=v25Distribution(l.semester,l.weeks);
      dist.forEach((hours,w)=>{
        let rem=hours;
        while(rem>0){
          const len=Math.min(Math.max(1,Number(s.blockLength||1)),rem);
          tasks.push({s,src,week:w+1,len});
          rem-=len;
        }
      });
    });
  });
  tasks.sort((a,b)=>b.len-a.len);
  tasks.forEach(t=>{
    const base={...t.s,subject:t.src.row["Дисциплина"]||t.s.subject,sourceRows:[t.src.index]};
    const candidates=v26Candidates(base,t.week,t.len,lessons).slice(0,25);
    if(!candidates.length){
      problems.push({s:t.s,src:t.src,reason:"Нет допустимого места на неделе "+t.week});
      return;
    }
    lessons.push(candidates[0]);
  });
  DATA.lessons=lessons;v08PersistData();
  v24RenderLedger();v24RenderProblems(problems);v25Render();v26RenderResult(lessons,problems);
  if(typeof v17Render==="function")v17Render();
  if(typeof v18RenderGrid==="function")v18RenderGrid();
}
function v26RenderResult(lessons,problems){
 const host=document.getElementById("v26_result");if(!host)return;
 let groupGaps=0;
 const groups=[...new Set(lessons.flatMap(x=>x.groups||[]))];
 groups.forEach(g=>{for(let d=0;d<days.length;d++)groupGaps+=v26GroupGap(lessons,g,d)});
 const maxDay=Math.max(0,...days.map((_,d)=>lessons.filter(x=>x.day===d).length));
 host.innerHTML=`<div class="card"><h3>v2.6 · результат оптимизации</h3>
 <div class="v26stats"><span>Занятий: <b>${lessons.length}</b></span><span>Неразмещено: <b>${problems.length}</b></span><span>Окна групп: <b>${groupGaps}</b></span><span>Макс. занятий/день: <b>${maxDay}</b></span></div>
 <p class="small">Алгоритм сначала соблюдает жёсткие ограничения, затем выбирает из нескольких допустимых вариантов по оценке качества. Это эвристический оптимизатор, а не доказательство глобального оптимума.</p>
 </div>`;
}
const v26Style=document.createElement("style");
v26Style.textContent=".v26stats{display:flex;gap:20px;flex-wrap:wrap;padding:10px;background:#f5f5f5;border-radius:8px;margin:10px 0}.v26stats span{padding:6px 10px}";
document.head.appendChild(v26Style);
if(!document.getElementById("v26_result"))document.body.insertAdjacentHTML("beforeend",'<div id="v26_result" class="section"></div>');
document.body.insertAdjacentHTML("beforeend",'<div id="v26_panel" class="section"><div class="card"><h3>v2.6 · оптимизатор</h3><button class="btn primary" onclick="v26GenerateOptimized()">🧠 Сгенерировать оптимизированное расписание</button></div></div>');
</script>


<script>
/* ===== НГХУ v2.7 — правило распределения Елены Олеговны ===== */
const v27OriginalScoreCandidate=v26ScoreCandidate;
function v27TeacherDayLoad(current,teacher,week,day){
  return current.filter(x=>x.teacher===teacher&&x.week===week&&x.day===day)
    .reduce((sum,x)=>sum+Number(x.blockLength||1),0);
}
function v27TeacherDays(current,teacher,week){
  return new Set(current.filter(x=>x.teacher===teacher&&x.week===week).map(x=>x.day));
}
v26Candidates=function(s,week,len,current){
  const out=[];
  const pattern=settings.teacherWorkPatterns?.[s.teacher];
  for(let d=0;d<days.length;d++){
    if(v16IsBlocked(week,d))continue;
    for(let st=0;st+len<=slots.length;st++){
      if(st<=4&&st+len>4)continue;
      if(pattern){
        const dayLoad=v27TeacherDayLoad(current,s.teacher,week,d);
        const used=v27TeacherDays(current,s.teacher,week);
        const newDays=new Set(used); newDays.add(d);
        if(dayLoad+len>pattern.maxDailySlots)continue;
        if(newDays.size>pattern.daysPerWeek)continue;
      }
      for(const room of settings.roomList||[]){
        const n={...s,week,day:d,start:st,room,blockLength:len};
        if(v17Conflicts(n,-1).length)continue;
        if(!v13RoomFits(s.subject,s.groups,room))continue;
        let score=v27OriginalScoreCandidate(n,current);
        if(pattern){
          const loads=days.map((_,dd)=>v27TeacherDayLoad(current,s.teacher,week,dd)+(dd===d?len:0)).filter(x=>x>0).sort((a,b)=>b-a);
          while(loads.length<pattern.targetDailySlots.length)loads.push(0);
          const target=[...pattern.targetDailySlots].sort((a,b)=>b-a);
          score-=loads.reduce((acc,x,i)=>acc+Math.abs(x-(target[i]||0)),0)*8;
          if(loads.length===pattern.daysPerWeek)score+=10;
        }
        if(v14IsPreferred("teachers",s.teacher,week,d,st))score+=20;
        if((s.groups||[]).some(g=>v14IsPreferred("groups",g,week,d,st)))score+=10;
        out.push({...n,score,date:v16DateFor(week,d)});
      }
    }
  }
  return out.sort((a,b)=>b.score-a.score);
};
settings.teacherWorkPatterns=settings.teacherWorkPatterns||{};
settings.teacherWorkPatterns["Елена Олеговна"]={daysPerWeek:3,maxDailySlots:4,targetDailySlots:[4,4,2]};
v08PersistData();
const v27Style=document.createElement("style");
v27Style.textContent=".v27notice{padding:12px;border:1px solid #ddd;border-radius:10px;margin:10px 0}.v27badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f5f5f5;margin-right:6px}";
document.head.appendChild(v27Style);
if(document.getElementById("v26_panel"))document.getElementById("v26_panel").insertAdjacentHTML("afterbegin",'<div class="v27notice"><b>Елена Олеговна · Иностранный язык</b><br><span class="v27badge">5 групп</span><span class="v27badge">2 ч/нед на группу</span><span class="v27badge">10 ч/нед всего</span><span class="v27badge">3 рабочих дня</span><span class="v27badge">цель: 4 + 4 + 2</span><br><span class="small">Дни недели выбирает оптимизатор по конфликтам. Фамилия преподавателя пока не указана.</span></div>');
</script>

<script>
(function(){
  const SYNC_KEY='nghu_v29_sync_url';
  const CLOUD_KEY='nghu_v29_cloud_workspace';

  function collectState(){
    const state={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith('nghu_')) state[k]=localStorage.getItem(k);
    }
    return state;
  }
  function applyState(state){
    Object.entries(state||{}).forEach(([k,v])=>localStorage.setItem(k,v));
  }
  function syncUrl(){return localStorage.getItem(SYNC_KEY)||'';}
  function setStatus(t,ok=false){

  }
  function collectState(){const state={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith('nghu_')&&![SYNC_KEY,CLOUD_KEY,CLOUD_TOKEN_KEY].includes(k)) state[k]=localStorage.getItem(k);} return state;}
  function applyState(state){Object.entries(state||{}).forEach(([k,v])=>localStorage.setItem(k,v));}
  async function push(){
    const url=syncUrl(); if(!url){setStatus('Синхронизация не настроена');return false;}
    const workspace=localStorage.getItem(CLOUD_KEY)||'nghu-main', token=localStorage.getItem(CLOUD_TOKEN_KEY)||'';
    try{setStatus('Сохраняю в облако…'); const r=await fetch(url+'/state/'+encodeURIComponent(workspace),{method:'PUT',headers:{'Content-Type':'application/json','X-Sync-Token':token},body:JSON.stringify({state:collectState(),clientUpdatedAt:new Date().toISOString()})}); if(!r.ok) throw new Error('HTTP '+r.status); setStatus('Сохранено в облако ✓',true); return true;}catch(e){setStatus('Ошибка: '+e.message);return false;}
  }
  async function pull(){

    const workspace=localStorage.getItem(CLOUD_KEY)||'nghu-main', token=localStorage.getItem(CLOUD_TOKEN_KEY)||'';
    try{setStatus('Загружаю…'); const r=await fetch(url+'/state/'+encodeURIComponent(workspace),{headers:{'X-Sync-Token':token}}); if(!r.ok) throw new Error('HTTP '+r.status); const data=await r.json(); if(!data.state) throw new Error('Нет данных'); applyState(data.state); setStatus('Данные загружены ✓',true); location.reload(); return true;}catch(e){setStatus('Ошибка: '+e.message);return false;}
  }
  function ui(){

    document.body.prepend(box);
    document.getElementById('v29_set').onclick=()=>{localStorage.setItem(SYNC_KEY,document.getElementById('v28_url').value.trim().replace(/\/$/,''));localStorage.setItem(CLOUD_KEY,document.getElementById('v29_workspace').value.trim()||'nghu-main');localStorage.setItem(CLOUD_TOKEN_KEY,document.getElementById('v29_token').value.trim());setStatus('Настройки сохранены');};
    document.getElementById('v29_pull').onclick=pull;

  }
  function start(){

    const oldSave=window.save;
    if(typeof oldSave==='function') window.save=function(){const r=oldSave.apply(this,arguments); clearTimeout(window.__v28timer); window.__v28timer=setTimeout(push,700); return r;};
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  window.v28PushSync=push; window.v28PullSync=pull;
})();
